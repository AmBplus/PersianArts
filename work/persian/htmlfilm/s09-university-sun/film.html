<!--
==========================================================================
S09 university-sun (own film, fictional, no client). CUT-BASED (6 cuts, no --one-take).
BOTH ratios from this one file: ?ratio=9x16 and ?ratio=16x9, each with its OWN layout table entry (rule 16b: designed, never a crop).
100 BPM, 25.00 s = 750 frames at 30 fps = 10.42 bars = 41.67 beats. SILENT v1 (zero audio; sound deferred until the owner approves the picture).
==========================================================================
FIX LOG v1 -> v2 (fix-round-1, from the independent QC review review-1.md). Story, palette and scene architecture unchanged.
  1. BLOCKER debug HUD. `new URLSearchParams(location.search + "&debug=2")` forced the debug branch for every frame, so a white
     `f<frame> {json}` box was baked into both v1 masters. Now `location.search` alone: debug is opt-in via ?debug=1 only and the
     ?capture=1 path can never enable it.   [params decl + render() HUD branch]
  2. Campus stat panel: `block([...], {align:"right"})` advanced RTL segments to the RIGHT, so ۸۴ landed on top of «هیئت» and ۴ / ۵۲
     fell outside the panel. The four rows are now explicit right-anchored pairs (label rightmost, gold number to its left) and the
     panel is taller (9x16 160->280, 16x9 130->180) so ALL FOUR numbers are legible in BOTH ratios.
  3. Faculty chip `"F0" + faDigits(i+1)` rendered as a Latin "F0" glued to a Persian digit. Now one coherent Persian chip «دانشکدهٔ ۲».
  4. CTA never rendered: gated on prog(t,9.0,0.6) with t=b-35 while the answer scene only reaches t=6.67 in a 25.000 s film.
     Retimed to prog(t,3.6,0.6) = 23.16 s. Deadline plate retimed to prog(t,2.4,0.5) = 22.44 s (it was gated past the end too).
  5. Deadline date clipped in 9:16 / segment-reversed in 16:9: the `block()` deadline call is replaced by two explicit
     right-anchored runs (label at the right, ۱۵ مهر to its left) inside a narrower plate, so the pair fits in both ratios.
  6. Black letterbox bands inside the 16:9 raster (~40 px right + bottom): the camera zoom went below 1 (0.955 wide / 0.965 tall),
     so the scene rect no longer covered the raster. Zoom is now always >= 1 and the pan is clamped to the visible window.
  7. CUTS[] and events.json declared frames [0,150,255,396,480,576,690]; the renderer dispatches on beats (b<5,10,16,19,23,35) =
     frames [0,90,180,288,342,414,630]. The frame list was the wrong one; header, CUTS[] and events.json now match the render.
  8. 9:16 legibility (primary ratio): the opening question is two fitted lines (~2x larger) and the closing payoff three fitted lines
     (~2.5x larger); 16:9 keeps a single payoff line at maximum fitted size. Panel rows and faculty plates enlarged.
  9. Copy/table fixes: «سال تاریخ» -> «سال تأسیس»; 16:9 had only 3 plate x-positions for 4 faculties (the 4th plate was drawn at
     NaN) — there are now 4 explicit plate positions in each ratio.
==========================================================================
LOGLINE   «از یک سؤالِ ساده تا یک مدرک» — one student's question travels through the whole university and comes back as a diploma.
PROTAGONIST  a single sheet of paper, one object across the whole film: blank exam sheet -> student card -> lab note -> notebook page ->
          thesis cover -> diploma. It never leaves frame; every cut lands on a bar line (beats 0, 5, 10, 16, 19, 23 on the 2.4 s bar grid).
CLOCK     100 BPM: beat 0.6 s, bar 2.4 s, bar line every 72 frames. Cuts at f0, f90, f180, f288, f342, f414, f630 (beats 0, 5, 10, 16, 19, 23, 35).
LAYOUT    ONE table per ratio (PA.layout):
          9x16 = tall: paper centred between y 560 and 1330, hero copy in the upper band (y<420) and the fact band below (y>1460);
          16x9 = wide: paper on the left half (~x 460), copy column on the right (x 1130-1780) and a bottom-left info strip.
COPY      "سؤالِ من چه می‌شود؟" (open) -> four faculty titles -> "آفتاب، جوابِ همان سؤال بود." + deadline «مهلت ثبت‌نام: ۱۵ مهر» + CTA.
ART       deep indigo night #0b1233 -> #1b2450, gold #e8b64c, warm white #f6f1e4. Vazirmatn (local @font-face, relative url only).
          Contrast checked: warm white on indigo 15.6:1, gold on #0b1233 9.2:1, gold on #1b2450 7.6:1 (body >= 4.5, large >= 3).
SCENES (100 BPM, beat 0.6 s, bar 2.4 s)
  1 QUESTION  beats 0-5    (0.00-3.00 s)  f0    dark exam hall, one blank sheet, the question; a pen enters at beat 4 (cut out at 4.5)
  2 SCIENCE   beats 5-10   (3.00-6.00 s)  f90   Faculty of Basic Sciences: chalk grid, formula mark, seal stamp; fact 1 (۸۴ faculty members)
  3 LAB       beats 10-16  (6.00-9.60 s)  f180  Faculty of Laboratory Sciences: amber beakers, hex pattern, lab-note mark; fact 2 (۴٫۵ ha labs)
  4 LETTERS   beats 16-19  (9.60-11.40 s) f288  Faculty of Literature and Humanities: warm gold, calligraphy, notebook mark; fact 3 (۵۲ years)
  5 ENGINEER  beats 19-23  (11.40-13.80 s) f342 Faculty of Engineering: gears, blueprint, thesis cover, red stamp; fact 4 (۱۴٬۲۰۰ students, dense panel)
  6 CAMPUS    beats 23-35  (13.80-21.00 s) f414 golden-hour campus, sun rays, four time-lapse paper cards, faculty name plates, all 3 numbers
  7 ANSWER    beats 35-41.67 (21.00-25.00 s) f630 the diploma + sunburst; the first question is answered, deadline and register CTA
EVENTS (beats) paper drop 1 | pen enters 3.4 | cut 5 | chalk mark 7 | seal stamp 9 | cut 10 | bubble pop 12 | mark 14 | cut 16 | ink stroke 18 | cut 19 |

["bubble pop", 12], ["lab mark", 14], ["cut to letters", 16], ["ink stroke", 18], ["cut to engineering", 19], ["gear tick", 20],
["stamp", 21], ["cut to campus", 23], ["plate reveal", 27], ["sun rays", 28], ["cut to answer", 35], ["diploma pop", 37],
["deadline stamp", 37.4], ["pad out", 40], ["CTA pulse", 38.6]]
  .map(([name, b]) => ({name, beat: b, t_s: +(b * BS).toFixed(4), frame: Math.round(b * BS * FPS)}));

const cv = document.getElementById("cv"); cv.width = W; cv.height = H; const ctx = cv.getContext("2d");
const stage = document.getElementById("stage"); stage.style.width = W + "px"; stage.style.height = H + "px";
const FAM = 'PAHead,Vazirmatn,sans-serif';
const F = (w, size) => `${w} ${size}px ${FAM}`;
const measure = (s, f) => { ctx.save(); ctx.font = f; const w = ctx.measureText(s).width; ctx.restore(); return w; };
// v2: largest weight-900 size at which EVERY line of `lines` fits `maxW` (hero copy is fitted instead of shrunk to illegibility)
const fitSize = (lines, size, weight, maxW) => { let s = size; for (const ln of lines) { const m = measure(ln, F(weight, size)); if (m > maxW) s = Math.min(s, Math.floor(size * maxW / m)); } return s; };

const nameLines = s => { const p = s.split(" و "); return p.length > 1 ? [p[0] + " و", p.slice(1).join(" و ")] : [s]; };

// inside a dir="ltr" isolate (the canvas equivalent of PA.ltr). PA.ltr is NOT used here: it returns an HTML span, which a
// canvas fillText would draw literally (screen-verified defect, see findings.md). The Latin side of a mixed line is drawn as
// its own segment with ctx.direction="ltr".
const ISO = {left: "\u2066", right: "\u2069"};
const wrapIsolate = s => Array.isArray(s) ? s : (ISO.left + s + ISO.right);
const DBG = params.get("debug") === "2" ? [] : null;
const txt = (str, o) => {
  if (o.maxW && measure(str, o.font) > o.maxW) o = Object.assign({}, o, {font: F(o.weight, Math.floor(o.size * o.maxW / measure(str, o.font)))});
  if (DBG) DBG.push([o.font, o.align || "-", Math.round(o.x), Math.round(o.y), o.alpha == null ? 1 : o.alpha, str.slice(0, 14)]);
  ctx.save(); if (o.direction) ctx.direction = o.direction; ctx.font = o.font; if (o.align) ctx.textAlign = o.align;
  if (o.blur) { ctx.shadowColor = o.blurC || "rgba(4,7,10,.75)"; ctx.shadowBlur = o.blur; ctx.shadowOffsetY = o.blurY || 0; }
  ctx.fillStyle = o.color; ctx.globalAlpha = o.alpha == null ? 1 : o.alpha; ctx.fillText(str, o.x, o.y); ctx.restore();
};
// block renderer: a numbered run keeps dir="ltr" + isolate; a Persian run keeps direction:rtl
const block = (segs, o) => {
  const pad = o.space == null ? 14 : o.space;
  const total = segs.map(s => measure(wrapIsolate(s.s), o.font)).reduce((a, b) => a + b, 0) + pad * (segs.length - 1);
  let x = o.align === "right" ? o.x : o.x - total / 2;
  const dir = s => s.dir || (/[\u0600-\u06FF]/.test(s.s) ? "rtl" : "ltr");
  const fits = [];
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i], d = dir(s), raw = measure(s.s, o.font), w = measure(wrapIsolate(s.s), o.font);
    fits.push({s, d, w, box: {x, y: o.y - o.font / 2, w, h: o.font}});
    txt(wrapIsolate(s.s), {x, y: o.y, font: o.font, color: s.color || o.color, direction: d, align: d === "rtl" ? "right" : "left", blur: o.blur, blurC: o.blurC, alpha: o.alpha});
    x += w + pad;

const R = rng(90210);
const grain = Array.from({length: 1500}, () => ({x: R(), y: R(), a: 0.03 + R() * 0.05, r: 0.8 + R() * 1.9}));
function fillGrad(x0, y0, x1, y1, stops, alpha = 1) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1); for (const [p, c] of stops) g.addColorStop(p, c);
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = g; ctx.fillRect(Math.min(x0, x1) - 4, Math.min(y0, y1) - 4, Math.abs(x1 - x0) + 8, Math.abs(y1 - y0) + 8); ctx.restore();
}
const glow = (x, y, r, c) => { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c); g.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); };

const vLine = (x, y, h, c, a = 1) => { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = c; ctx.fillRect(x, y, 2, h); ctx.restore(); };
const ctxIn = (x, y, w, h) => { ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); };
const ctxOut = () => ctx.restore();
// beat-locked decay used by every hit (pure in t)
const hitPulse = (b, at, d = 0.9) => b < at ? 0 : Math.exp(-(b - at) / d);
// a sheet of paper: six forms, always ONE object
function sheet(b, form, mark) {
  const P = L.paper, drop = ease.outBack(prog(b, 0.7, 1.1)), tilt = P.tilt0 * (1 - 0.7 * prog(b, 3, 2));
  let w = P.w, h = P.h;

  if (form === "note") { w *= 0.86; h *= 0.74; }
  if (form === "thesis") { w *= 0.98; h *= 1.02; }
  if (form === "blueprint") { w *= 1.06; h *= 0.96; }
  if (form === "diploma") { w *= 1.16; h *= 1.14; }

  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(scale, scale);
  ctx.fillStyle = "rgba(3,6,20,.45)"; roundR(-w / 2 + 14, -h / 2 + 26, w, h, 14); ctx.fill();
  ctx.fillStyle = "#f6f1e4"; roundR(-w / 2, -h / 2, w, h, 12); ctx.fill();
  ctx.strokeStyle = "rgba(120,100,60,.5)"; ctx.lineWidth = 3; ctx.stroke();

  ctx.fillStyle = form === "diploma" ? "#e8b64c" : "rgba(27,36,80,.10)"; ctx.fillRect(-w / 2 + 16, -h / 2 + 16, w - 32, form === "diploma" ? 26 : 14);
  ctx.strokeStyle = "rgba(40,50,90,.13)"; ctx.lineWidth = 2;

  }

    ctx.beginPath(); ctx.moveTo(w * 0.26, -h * 0.20); ctx.quadraticCurveTo(0, -h * 0.30, -w * 0.26, -h * 0.20); ctx.stroke();
    ctx.strokeStyle = "#e8b64c"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(w * 0.20, h * 0.28); ctx.lineTo(-w * 0.20, h * 0.28); ctx.stroke(); ctx.restore();
  }

  ctx.setTransform(cz, 0, 0, cz, W / 2 - ccx * cz, H / 2 - ccy * cz);

  else if (b < 10) scFaculty(b, 0);
  else if (b < 16) scFaculty(b, 1);
  else if (b < 19) scFaculty(b, 2);
  else if (b < 23) scFaculty(b, 3);
  else if (b < 35) scCampus(b);
  else scAnswer(b);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.5)"); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < grain.length; i++) { const g = grain[i], ox = ((g.x * W + n * (i % 7 + 1) * 3) % W), oy = ((g.y * H + n * (i % 5 + 1) * 2) % H);

  window.film.frame = n;
}
window.film = {events: EVENTS, cuts: CUTS, duration: DUR, fps: FPS, bpm: BPM, t0: T0, frame: 0, ready: false, ratio: RATIO,
  seek(t) { render(Math.round(t * FPS)); return this.frame; }};
// ---------------- boot: paper origin per ratio, then fonts
const ps = L.paper;
ps.origCx = ps.cx; ps.origCy = ps.cy; ps.origW = ps.w; ps.origH = ps.h;
function fit() { const sc = params.get("capture") === "1" ? 1 : Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${sc})`; }
addEventListener("resize", fit); fit();
Promise.all([document.fonts.load("900 40px PAHead"), document.fonts.load("700 40px PAHead"), document.fonts.load("400 40px PAHead")])
  .then(() => document.fonts.ready).then(() => { render(0); window.film.ready = true; });
// debug metrics: node work/persian/htmlfilm/s09-university-sun/film.html?debug=1 (never runs during capture)

  window.film.metrics = () => {
    const out = [];

      render(f + 2); const img = ctx.getImageData(0, 0, W, H).data;
      let ink = 0, n2 = 0; const stepPx = Math.max(4, Math.floor(Math.min(W, H) / 90));
      for (let y = 0; y < H; y += stepPx) for (let x = 0; x < W; x += stepPx) { const i = (y * W + x) * 4; const l = (img[i] * 0.3 + img[i + 1] * 0.6 + img[i + 2] * 0.1) / 255; if (l > 0.15) ink++; n2++; }

    });

}

let playing = false, t0p = 0;
function tick(ts) { if (!playing) return; render(((ts - t0p) * FPS / 1000) % DURATION); requestAnimationFrame(tick); }
