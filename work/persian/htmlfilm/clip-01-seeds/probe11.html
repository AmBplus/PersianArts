<!doctype html>
<html><head><meta charset="utf-8">
<script src="../lib/pa-motion.js"></script>
<script src="../lib/pa-camera.js"></script>
<script src="../lib/pa-layout.js"></script>
<style>
@font-face{font-family:"PAHead";src:url("fonts/Vazirmatn-Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:100vw;height:100vh;overflow:hidden;transform-origin:0 0;direction:rtl}
canvas{position:absolute;left:0;top:0}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<script>
"use strict";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"); cv.width = 1080; cv.height = 1920;cv.width = 1080; cv.height = 1920;
function seek(t) {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,1080,1920);
  ctx.fillStyle = "#0e1220"; ctx.fillRect(0,0,1080,1920);
  ctx.fillStyle = "#e8b04b"; ctx.fillRect(100, 100, 880, 1720);
  ctx.fillStyle = "#fff"; ctx.font = "60px PAHead, sans-serif";
  ctx.fillText("t=" + t.toFixed(2), 200, 900);
}
window.film = {seek, duration: 20, fps: 30, ready: true};
seek(0);
</script>
</body></html>
