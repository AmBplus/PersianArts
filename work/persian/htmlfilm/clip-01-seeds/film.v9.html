LOGLINE   یک دانه‌ی برف تنها در تاریکی می‌رقصد؛ باد او را با خود می‌برد و هر بار که با نور می‌رقصد نزدیک‌تر می‌شود، تا این‌که به زمین می‌رسد و دانه‌ی کوچکی از آن می‌روید؛ «از یک دانه، یک بهار».
PROTAGONIST  snowflake (persistent actor): 6-arm star with secondary arms, warm rim light from the light source; seed/sprout at the end is the payoff.
CLOCK     120 BPM: the flake's dance steps land ON beats (2, 6, 10, 14, 18); light pulses on beats; bar = 2s.
LAYOUT    ONE table per ratio (PA.layout): 9x16 tall — light rays from upper-left, flake travels a curved path down-right to the snow ground at the bottom; 16x9 wide — flake arcs left-to-right across the stage.
COPY      «هر دانه‌ای یک مسیر دارد» (t=3) / «یک دانه…» (t=11.5) / «…بهار می‌شود» (t=16) / «از یک دانه، یک بهار» (t=18, payoff card)
ART       night #0e1220 -> #1a2138 radial; light rays warm #ffe9b8 additive from upper-left; snow ground #dfe7f2 with blue shadow #9fb4d4; flake #eaf2ff with warm rim #ffd98a; sprout #6fcf97. Vazirmatn.
SCENES (beat 0.5s, bar 2s)
  1 DARK  beats 0-4   (0-2s)     deep night, light shaft, dust motes, flake materializes (scale+rotate outBack)
  2 DANCE beats 4-14  (2-7s)     flake steps on beats 2,6,10 with camera parallax, depth layers drift
  3 DRIFT beats 14-30 (7-15s)    wind gusts push the flake on bar lines; copy 2; camera push-in
  4 LAND  beats 30-38 (15-19s)   flake descends to the ground (outCubic), lands on beat 30 (hit), light warms
  5 GROW  beats 38-40 (19-20s)   sprout unfolds (outExpo) on beat 38, payoff card fades in
EVENTS (beats) materialize 4 | step 6 | step 10 | gust 14 | gust 18 | gust 22 | push 26 | land hit 30 | warm 34 | grow 38 | final settle 40 (ends_film)
