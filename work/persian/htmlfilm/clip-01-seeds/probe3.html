<!doctype html>
<html><head><meta charset="utf-8">
<script src="../lib/pa-motion.js"></script>
</head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<script>
const ctx = document.getElementById("cv").getContext("2d");
function seek(t) {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,1080,1920);
  ctx.fillStyle = "#0e1220"; ctx.fillRect(0,0,1080,1920);
  const grow = PA.ease.outBack(PA.clamp ? PA.clamp((t - 0.4) / 0.8) : Math.max(0, Math.min(1, (t-0.4)/0.8)));
  ctx.fillStyle = "#e8b04b"; ctx.fillRect(300, 800, 100 + 300 * grow, 100 + 300 * grow);
}
window.film = {seek, duration: 2, fps: 30, ready: true};
seek(1);
</script>
</body></html>
