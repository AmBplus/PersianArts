LOGLINE   A tired night, one cup, and a steam that lifts the whole day off your shoulders.

          breaks into drifting wisps -> a long exhale that fills the room -> a low settling breath at the rim.
          The tin and the glass cup are its stage.

          NO BLUE anywhere. Steam = additive puffs; one macro->wide camera move; a beat-locked warm light sweep every 2
          beats (1.25 s) is the only rhythmic event. Vazirmatn (local @font-face), plus a faint fixed film grain so the
          dark night never reads as an empty band (L-088/L-092/L-101).

  1 COLD    beats  0-4.8   (0.00-3.00 s)   macro-ish on the closed cold tin at a cluttered night desk; dust crawls through a

  4 BREATHE beats 12-16.8  (7.50-10.50 s)  the longest exhale: camera pulls back, steam fills the room, the desk clutter clears
  5 STAGE   beats 16.8-19.2 (10.50-12.00 s) medium: steam drifts from the cup TOWARD the tin; the tin gets its rim light and label
  6 WARM    beats 19.2-24  (12.00-15.00 s)  wide: the camera rests, the tin is the hero, support line then headline + rule + CTA
