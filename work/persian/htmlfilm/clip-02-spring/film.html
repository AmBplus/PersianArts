<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>clip-02 spring — یک دانه</title>
<style>
@font-face{font-family:"PAHead";src:url("../fonts/Vazirmatn-Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
html,body{margin:0;height:100%;background:#05070a;overflow:hidden}
canvas{position:absolute;left:0;top:0}
</style>
<script src="../lib/pa-motion.js"></script>
<script src="../lib/pa-film.js"></script>
</head>
<body>
<canvas id="cv"></canvas>
<script>
"use strict";
/* clip-02 «بهار» — one continuous vertical world: sky above the soil line (worldY 0), soil below.
   The camera travels down through the soil and back up; there are no cuts at all, so no join can judder.
   Fixes carried from metrics/clip-01.json: C1-02 (type queue), C1-03 (soft beams), C1-04 (grain+vignette),
   C1-05 (real contact: the drop hits the soil and the shoot breaks the surface), C1-06 (named easings). */
const {clamp, lerp, prog, ease, rng} = PA;
const FPS = 30, BPM = 120, BS = 60 / BPM, DURATION = 40 * BS;
const W = 1080, H = 1920;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
cv.width = W; cv.height = H;

const C = {
  sky0: "#0a121a", sky1: "#1a2b34", sky2: "#3b4f53",
  dawn: "rgba(255,214,150,ALPHA)",
  rain: "#cfe3ef",
  soil0: "#3d2c21", soilMid: "#2a1e17", soil1: "#170f0b",
  seed: "#e9c07c", seedDark: "#9c7038",
  root: "#d9bf95", green: "#86d9a0", green2: "#4aa872",
  ink: "#f8f2e7", muted: "#cbd6dc",
};

// ---- camera: one vertical move, four named jobs -------------------------------------------
const kf = (list) => (t) => {
  if (t <= list[0][0]) return list[0][1];
  for (let i = 1; i < list.length; i++) {
    if (t <= list[i][0]) {
      const a = list[i - 1], b = list[i];
      const e = (b[2] || PF.motion.ambient)(clamp((t - a[0]) / (b[0] - a[0])));
      return lerp(a[1], b[1], e);
    }
  }
  return list[list.length - 1][1];
};
const camY = kf([[0, -560], [5.5, -540], [9.8, 380, PF.motion.settle], [13, 340], [15.6, 380], [18, 40, PF.motion.reveal], [20, 0]]);
const camZoom = kf([[0, 1.0], [9.8, 1.09], [15.6, 1.10], [18, 1.02], [20, 1.05]]);

// ---- world ---------------------------------------------------------------------------------
const SEED = {x: 520, y: 300};
const R = rng(20261019);
const speckles = Array.from({length: 900}, () => ({x: R() * W, y: 8 + R() * 1500, r: 1 + R() * 2.6, a: 0.05 + R() * 0.16}));
const pebbles = Array.from({length: 34}, () => { const big = R() > 0.82; return {x: R() * W, y: 40 + R() * 1400, rx: (big ? 26 : 8) + R() * (big ? 30 : 18), ry: (big ? 16 : 5) + R() * (big ? 16 : 11), rot: R() * 3.14, tone: R()}; });
const tufts = Array.from({length: 26}, () => ({x: R() * W, h: 10 + R() * 26, lean: (R() - 0.5) * 0.8, ph: R() * 6.28}));
const rainBack = Array.from({length: 150}, () => ({x: R() * (W + 200) - 100, y: R() * 1400, len: 40 + R() * 90, sp: 900 + R() * 500, a: 0.10 + R() * 0.18}));
const rainFront = Array.from({length: 46}, () => ({x: R() * (W + 200) - 100, y: R() * 1400, len: 70 + R() * 130, sp: 1400 + R() * 700, a: 0.16 + R() * 0.22}));
const seep = Array.from({length: 16}, () => ({x: 180 + R() * 720, ph: R(), sp: 0.10 + R() * 0.12, r: 1.6 + R() * 2.4}));
const splash = Array.from({length: 12}, (_, i) => ({a: (i / 12) * Math.PI - Math.PI / 2, v: 0.5 + R() * 0.5, r: 1.5 + R() * 2.5}));

const sy = (t, worldY, par = 1) => worldY - camY(t) * par + H * 0.5;

function surfaceWave(x) {
  return 7 * Math.sin(x * 0.0055 + 0.8) + 4.5 * Math.sin(x * 0.017 + 2.2) + 2 * Math.sin(x * 0.041 + 0.3);
}

// ---- sky -----------------------------------------------------------------------------------
function drawSky(t, sy0) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const dawn = PF.motion.ambient(PF.win(t, 13.5, 19.5));
  g.addColorStop(0, C.sky0);
  g.addColorStop(0.42, C.sky1);
  g.addColorStop(0.78, mix("#1a2b34", "#4a5347", dawn * 0.7));
  g.addColorStop(1, mix("#283b40", "#6b5a3c", dawn));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // dawn glow behind the horizon (rises with time)
  const gy = sy0 + 40;
  const glow = ctx.createRadialGradient(W * 0.28, gy, 20, W * 0.28, gy, 900);
  const gi = 0.12 + 0.55 * PF.motion.ambient(PF.win(t, 13.8, 18.8));
  glow.addColorStop(0, `rgba(255,196,120,${gi})`);
  glow.addColorStop(0.45, `rgba(255,170,100,${gi * 0.35})`);
  glow.addColorStop(1, "rgba(255,150,80,0)");
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function mix(a, b, k) {
  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  const c = pa.map((v, i) => Math.round(lerp(v, pb[i], clamp(k))));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function drawHills(t, sy0) {
  // two soft ridges: depth 0.12 / 0.28 so the camera move reads as depth, not scale
  const layers = [{k: 0.12, col: "#16242b", amp: 26, base: -60}, {k: 0.28, col: "#101a20", amp: 18, base: -18}];
  for (const L of layers) {
    const y0 = sy0 + L.base;
    ctx.fillStyle = L.col;
    ctx.beginPath();
    ctx.moveTo(-20, y0);
    for (let x = -20; x <= W + 20; x += 30) ctx.lineTo(x, y0 - L.amp * (0.6 + 0.4 * Math.sin(x * 0.0032 + L.k * 9)) - 8 * Math.sin(x * 0.011 + L.k * 4));
    ctx.lineTo(W + 20, sy0 + 60); ctx.lineTo(-20, sy0 + 60); ctx.closePath(); ctx.fill();
  }
}

// ---- rain ----------------------------------------------------------------------------------
function drawRain(t, sy0, list, depth) {
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, Math.max(0, sy0 + 6)); ctx.clip();
  ctx.lineCap = "round";
  const span = 1500;
  for (const d of list) {
    // rain lives in world space above the soil line (worldY < 0), so it scrolls with the camera
    const y = ((d.y + t * d.sp) % span) - span;
    const x = d.x + Math.sin(t * 0.6 + d.x * 0.01) * 8 * depth;
    const yy = sy(t, y);
    if (yy < -220 || yy > sy0 + 20) continue;
    ctx.strokeStyle = `rgba(207,227,239,${d.a * (1 - 0.55 * PF.win(t, 16.5, 19.5))})`;
    ctx.lineWidth = depth > 1 ? 2.4 : 1.6;
    ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x - 5, yy + d.len); ctx.stroke();
  }
  ctx.restore();
}

// ---- soil ----------------------------------------------------------------------------------
function drawSoil(t, sy0) {
  const g = ctx.createLinearGradient(0, sy0, 0, H);
  g.addColorStop(0, C.soil0); g.addColorStop(0.30, C.soilMid); g.addColorStop(1, C.soil1);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-20, sy0 + surfaceWave(-20));
  for (let x = 0; x <= W; x += 24) ctx.lineTo(x, sy0 + surfaceWave(x));
  ctx.lineTo(W + 20, H + 40); ctx.lineTo(-20, H + 40); ctx.closePath(); ctx.fill();

  // topsoil band: a warmer, lighter layer right under the crust (reads as horizon line in a cross-section)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-20, sy0 + surfaceWave(-20));
  for (let x = 0; x <= W; x += 24) ctx.lineTo(x, sy0 + surfaceWave(x));
  for (let x = W; x >= 0; x -= 24) ctx.lineTo(x, sy0 + 118 + 10 * Math.sin(x * 0.004 + 1.1));
  ctx.closePath();
  ctx.fillStyle = "rgba(120,86,58,0.45)"; ctx.fill();
  ctx.restore();

  // strata: three thin, slightly tilted seams that give the cross-section scale
  ctx.save();
  for (const [d, a, tone] of [[300, 0.10, "#8a6a4a"], [640, 0.07, "#6b513a"], [980, 0.05, "#4a382a"]]) {
    ctx.strokeStyle = tone; ctx.globalAlpha = a; ctx.lineWidth = 14;
    ctx.beginPath();
    for (let x = -20; x <= W + 20; x += 40) {
      const y = sy0 + d + 26 * Math.sin(x * 0.0035 + d) + x * 0.02;
      x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();

  // surface crust: a lighter rim along the soil line
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-20, sy0 + surfaceWave(-20));
  for (let x = 0; x <= W; x += 24) ctx.lineTo(x, sy0 + surfaceWave(x));
  ctx.strokeStyle = "rgba(198,160,116,0.55)"; ctx.lineWidth = 5; ctx.stroke();
  ctx.strokeStyle = "rgba(255,222,178,0.18)"; ctx.lineWidth = 14; ctx.stroke();
  ctx.restore();

  // texture: speckles + pebbles in world space (they scroll with the camera => real parallax)
  for (const s of speckles) {
    const y = sy(t, s.y);
    if (y < sy0 + 4 || y > H + 10) continue;
    ctx.fillStyle = `rgba(224,196,158,${s.a})`;
    ctx.beginPath(); ctx.arc(s.x, y, s.r, 0, 6.2832); ctx.fill();
  }
  for (const p of pebbles) {
    const y = sy(t, p.y);
    if (y < sy0 + 10 || y > H + 30) continue;
    ctx.save(); ctx.translate(p.x, y); ctx.rotate(p.rot);
    ctx.fillStyle = p.tone > 0.5 ? "rgba(92,74,58,0.55)" : "rgba(48,37,29,0.6)";
    ctx.beginPath(); ctx.ellipse(0, 0, p.rx, p.ry, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "rgba(230,205,170,0.06)";
    ctx.beginPath(); ctx.ellipse(-p.rx * 0.2, -p.ry * 0.35, p.rx * 0.6, p.ry * 0.4, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  // grass tufts on the surface
  for (const g2 of tufts) {
    const bx = g2.x, by = sy0 + surfaceWave(g2.x);
    if (by < -40 || by > H + 40) continue;
    const sway = Math.sin(t * 1.4 + g2.ph) * 3;
    ctx.strokeStyle = "rgba(96,124,86,0.75)"; ctx.lineWidth = 2.4; ctx.lineCap = "round";
    for (const k of [-1, 0, 1]) {
      ctx.beginPath(); ctx.moveTo(bx + k * 4, by);
      ctx.quadraticCurveTo(bx + k * 4 + g2.lean * 6 + sway, by - g2.h * 0.6, bx + k * 4 + g2.lean * 12 + sway * 1.6, by - g2.h * (k === 0 ? 1 : 0.78));
      ctx.stroke();
    }
  }
}

function drawSeep(t, sy0) {
  const wake = PF.motion.enter(PF.win(t, 8.6, 10.0));
  for (const d of seep) {
    const k = ((t * d.sp + d.ph) % 1);
    const y = sy(t, 12 + k * 330);
    if (y < sy0 || y > H) continue;
    const a = 0.42 * Math.sin(k * Math.PI) * wake;
    ctx.fillStyle = `rgba(198,226,236,${a})`;
    ctx.beginPath(); ctx.ellipse(d.x + Math.sin(k * 8 + d.ph * 9) * 6, y, d.r, d.r * 2.1, 0, 0, 6.2832); ctx.fill();
  }
}

// ---- the seed, its root and its shoot -------------------------------------------------------
function drawRoot(t, sx, syy) {
  const p = PF.motion.reveal(PF.win(t, 10.4, 14.4));
  if (p <= 0) return;
  const branches = [
    {a: 0.0, len: 330, bend: -120, w: 8},
    {a: -0.55, len: 240, bend: 120, w: 5.5, d: 0.12},
    {a: 0.6, len: 250, bend: -140, w: 5.5, d: 0.18},
    {a: -1.0, len: 170, bend: 100, w: 4, d: 0.30},
    {a: 1.05, len: 180, bend: -95, w: 3.8, d: 0.34},
  ];
  ctx.save();
  ctx.lineCap = "round";
  for (const b of branches) {
    const q = PF.motion.reveal(clamp((p - (b.d || 0)) / (1 - (b.d || 0))));
    if (q <= 0) continue;
    const ex = sx + Math.sin(b.a) * b.len * q, ey = syy + Math.cos(b.a) * b.len * q;
    const cx = sx + Math.sin(b.a) * b.len * 0.5 * q + b.bend * q;
    const cy = syy + Math.cos(b.a) * b.len * 0.5 * q;
    ctx.strokeStyle = "rgba(217,191,149,0.92)"; ctx.lineWidth = b.w * (0.4 + 0.6 * q);
    ctx.beginPath(); ctx.moveTo(sx, syy); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke();
    // root hairs
    if (q > 0.55) {
      ctx.strokeStyle = "rgba(217,191,149,0.35)"; ctx.lineWidth = 1.6;
      for (const f of [0.5, 0.75]) {
        const hx = lerp(sx, ex, f), hy = lerp(syy, ey, f);
        const dir = b.a > 0 ? 1 : -1;
        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + 26 * dir * q, hy + 16 * q); ctx.stroke();
      }
    }
  }
  ctx.restore();
}

function leaf(ctx, x, y, len, wid, ang, fill, alpha) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.globalAlpha = alpha;
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.45, -wid, len, 0);
  ctx.quadraticCurveTo(len * 0.45, wid, 0, 0);
  ctx.fill();
  ctx.strokeStyle = "rgba(30,60,40,0.35)"; ctx.lineWidth = Math.max(1, len * 0.02);
  ctx.beginPath(); ctx.moveTo(len * 0.06, 0); ctx.lineTo(len * 0.94, 0); ctx.stroke();
  ctx.restore();
}

function drawShoot(t, sx, syy, surfaceScreenY) {
  const grow = PF.motion.reveal(PF.win(t, 11.4, 14.6));
  const emerge = PF.motion.reveal(PF.win(t, 16.2, 18.6));
  if (grow <= 0) return;
  const tipWorld = lerp(SEED.y, -120, grow);
  const tip = sy(t, tipWorld);
  const midX = sx + Math.sin(t * 0.9) * 6;

  ctx.save();
  ctx.lineCap = "round";
  const g = ctx.createLinearGradient(sx, syy, midX, tip);
  g.addColorStop(0, "#3f7d55"); g.addColorStop(0.6, C.green2); g.addColorStop(1, C.green);
  ctx.strokeStyle = g; ctx.lineWidth = lerp(11, 15, grow);
  ctx.beginPath(); ctx.moveTo(sx, syy);
  ctx.quadraticCurveTo(midX + 74 * Math.sin(grow * 2.2) + 18, lerp(syy, tip, 0.5), midX, tip);
  ctx.stroke();
  ctx.restore();

  // first two leaves (underground, small), then they open up above the surface
  const p1 = PF.motion.reveal(PF.win(t, 13.0, 15.0));
  const p2 = PF.motion.reveal(PF.win(t, 17.0, 19.2));
  const len = lerp(58, 210, p2) * (0.35 + 0.65 * p1);
  if (p1 > 0) {
    const flutter = Math.sin(t * 1.8) * 0.05;
    leaf(ctx, midX, tip + 6, len, len * 0.34, -0.85 - 0.35 * p2 + flutter, C.green, 0.95);
    leaf(ctx, midX, tip + 6, len * 0.92, len * 0.31, Math.PI + 0.85 + 0.35 * p2 - flutter, C.green2, 0.95);
  }
  // seed casing stays visible at the base of the shoot
  ctx.save();
  ctx.fillStyle = C.seed; ctx.strokeStyle = "rgba(120,84,40,0.8)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(sx, syy, 17, 12, -0.25, 0, 6.2832); ctx.fill(); ctx.stroke();
  ctx.restore();
  void surfaceScreenY;
}

function drawSeedBody(t, sx, syy) {
  const wake = PF.motion.enter(PF.win(t, 10.4, 11.6));
  ctx.save();
  // warm inner light once it wakes
  if (wake > 0) {
    const gl = ctx.createRadialGradient(sx, syy, 2, sx, syy, 110);
    gl.addColorStop(0, `rgba(255,206,130,${0.34 * wake})`);
    gl.addColorStop(1, "rgba(255,180,90,0)");
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(sx, syy, 110, 0, 6.2832); ctx.fill();
  }
  const g = ctx.createLinearGradient(sx - 20, syy - 20, sx + 22, syy + 18);
  g.addColorStop(0, "#f4d59a"); g.addColorStop(0.5, C.seed); g.addColorStop(1, C.seedDark);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(sx, syy, 34, 23, -0.22, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = "rgba(60,40,20,0.55)"; ctx.lineWidth = 2.2; ctx.stroke();
  // rim light from the upper left: the only strong highlight underground, so the eye finds the seed
  ctx.strokeStyle = "rgba(255,226,178,0.85)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(sx, syy, 34, 23, -0.22, Math.PI * 0.95, Math.PI * 1.75); ctx.stroke();
  // contact shadow under it
  ctx.fillStyle = "rgba(10,6,4,0.5)";
  ctx.beginPath(); ctx.ellipse(sx + 4, syy + 26, 40, 12, 0, 0, 6.2832); ctx.fill();
  // the crack: the moment it wakes
  const crack = PF.motion.enter(PF.win(t, 11.2, 11.9));
  if (crack > 0) {
    ctx.strokeStyle = `rgba(255,244,214,${0.9 * crack})`; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(sx - 12 * crack, syy - 6); ctx.lineTo(sx, syy + 1); ctx.lineTo(sx + 10 * crack, syy - 5); ctx.stroke();
  }
  ctx.restore();
}

// ---- the drop that starts everything --------------------------------------------------------
function drawDrop(t, sy0) {
  const hit = 2.5, age = t - hit;
  if (age < -0.55) {
    // falling drop, visible for half a second before impact
    const k = clamp((t - (hit - 0.55)) / 0.55);
    const y = lerp(-60, sy0 + surfaceWave(SEED.x) - 6, ease.inCubic(k));
    ctx.fillStyle = "rgba(214,236,246,0.9)";
    ctx.beginPath(); ctx.ellipse(SEED.x, y, 5, 11, 0, 0, 6.2832); ctx.fill();
    return;
  }
  if (age < 0 || age > 1.5) return;
  // impact: rings on the soil line + a few splash droplets
  for (let i = 0; i < 3; i++) {
    const a = clamp((age - i * 0.12) / 0.9);
    if (a <= 0 || a >= 1) continue;
    const rx = 10 + a * 120, ry = rx * 0.28;
    ctx.strokeStyle = `rgba(222,240,248,${0.55 * (1 - a)})`; ctx.lineWidth = 3 * (1 - a) + 0.6;
    ctx.beginPath(); ctx.ellipse(SEED.x, sy0 + surfaceWave(SEED.x) + 2, rx, ry, 0, 0, 6.2832); ctx.stroke();
  }
  for (const s of splash) {
    const k = age / 0.55;
    if (k > 1) continue;
    const x = SEED.x + Math.cos(s.a) * 70 * s.v * k;
    const y = sy0 + surfaceWave(SEED.x) - Math.sin(s.a) * 60 * s.v * k + 190 * k * k;
    ctx.fillStyle = `rgba(214,236,246,${0.75 * (1 - k)})`;
    ctx.beginPath(); ctx.arc(x, y, s.r, 0, 6.2832); ctx.fill();
  }
}

// ---- copy ----------------------------------------------------------------------------------
const BODY = PF.typeQueue([
  {txt: "باران که می‌آید، دانه بیدار می‌شود", t0: 3.0, t1: 6.6, y: 0.150},
  {txt: "ریشه راهش را پیدا می‌کند", t0: 9.6, t1: 12.6, y: 0.150},
  {txt: "ساقه به سمت نور می‌رود", t0: 13.2, t1: 15.9, y: 0.150},
], {gap: 0.4});
const HERO = {t0: 17.6, t1: 20.4, main: "بهار", sub: "از زیر خاک شروع می‌شود"};

function drawCopy(t) {
  for (const ln of BODY) {
    const a = PF.motion.enter(PF.win(t, ln.t0, ln.t0 + 0.5)) * (1 - PF.win(t, ln.t1 - 0.45, ln.t1));
    if (a <= 0.004) continue;
    ctx.save();
    ctx.shadowColor = "rgba(6,10,14,0.75)"; ctx.shadowBlur = 22; ctx.shadowOffsetY = 3;
    PF.drawLine(ctx, {text: ln.txt, x: W / 2, y: H * ln.y, px: 100, weight: 700, color: C.ink, alpha: a, t, t0: ln.t0, stagger: 0.06, dur: 0.45, maxW: W - 192});
    ctx.restore();
  }
  // hero lockup: the payoff line, biggest type in the film (>= 12% of height)
  const a = PF.motion.enter(PF.win(t, HERO.t0, HERO.t0 + 0.7)) * (1 - PF.win(t, HERO.t1 - 0.5, HERO.t1));
  if (a > 0.004) {
    ctx.save();
    ctx.shadowColor = "rgba(255,196,120,0.45)"; ctx.shadowBlur = 40;
    PF.drawLine(ctx, {text: HERO.main, x: W / 2, y: H * 0.215, px: 210, weight: 900, color: "#ffd9a0", alpha: a, t, t0: HERO.t0, stagger: 0, dur: 0.6, rise: 0.22, maxW: W - 260});
    ctx.shadowColor = "rgba(6,10,14,0.7)"; ctx.shadowBlur = 20;
    PF.drawLine(ctx, {text: HERO.sub, x: W / 2, y: H * 0.215 + 104, px: 88, weight: 600, color: C.ink, alpha: a, t, t0: HERO.t0 + 0.35, stagger: 0.05, dur: 0.5, maxW: W - 192});
    ctx.restore();
  }
}

// ---- frame ---------------------------------------------------------------------------------
function seek(t) {
  t = clamp(t, 0, DURATION);
  const cy = camY(t), z = camZoom(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const sy0 = sy(t, 0);
  drawSky(t, sy0);
  drawHills(t, sy0);
  drawRain(t, sy0, rainBack, 0.7);

  // world group (camera + zoom around the frame centre)
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  drawSoil(t, sy0);
  drawSeep(t, sy0);
  drawDrop(t, sy0);
  drawRoot(t, SEED.x, sy(t, SEED.y));
  drawSeedBody(t, SEED.x, sy(t, SEED.y));
  drawShoot(t, SEED.x, sy(t, SEED.y), sy0);
  drawRain(t, sy0, rainFront, 1.4);
  ctx.restore();

  // dawn beams (soft sprites, never a hard polygon edge)
  const beamA = PF.motion.ambient(PF.win(t, 14.6, 19.0));
  if (beamA > 0.01) {
    const wob = Math.sin(t * 0.5) * 0.03;
    PF.beam(ctx, W * 0.06, -180, 0.62 + wob, 2400, 300, C.dawn, 0.20 * beamA, wob);
    PF.beam(ctx, W * 0.30, -220, 0.74 + wob, 2300, 200, C.dawn, 0.13 * beamA, -wob);
    PF.beam(ctx, W * 0.58, -240, 0.88 + wob, 2200, 150, C.dawn, 0.09 * beamA, wob);
  }

  PF.grain(ctx, W, H, t, {amount: 0.052});
  PF.vignette(ctx, W, H, {strength: 0.5});
  drawCopy(t);
  void cy;
}

// QC hook: copy alphas per line, so a ghosted line can be diagnosed without guessing
const copyAlpha = (t) => BODY.map((ln) => ({txt: ln.txt, a: +(PF.motion.enter(PF.win(t, ln.t0, ln.t0 + 0.5)) * (1 - PF.win(t, ln.t1 - 0.45, ln.t1))).toFixed(3)}));
window.film = {seek, duration: DURATION, fps: FPS, ready: true, copyAlpha};
seek(0);
</script>
</body>
</html>
