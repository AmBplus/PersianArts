<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;position:absolute;left:0;top:0}</style>
<script type="importmap">
{"imports":{
  "three": "../../src/workbench/node_modules/three/build/three.module.js",
  "three/addons/": "../../src/workbench/node_modules/three/examples/jsm/"
}}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";
import {ShaderPass} from "three/addons/postprocessing/ShaderPass.js";

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d1620, 0.0012);
const cam = new THREE.PerspectiveCamera(40, W / H, 1, 8000);
cam.position.set(0, 90, 700);

// gradient sky dome
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {uTop: {value: new THREE.Color(0x0a1220)}, uMid: {value: new THREE.Color(0x2a4a5a)}, uLow: {value: new THREE.Color(0xffb066)}, uSun: {value: new THREE.Vector3(-0.4, 0.25, -0.8).normalize()}},
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vDir; uniform vec3 uTop, uMid, uLow, uSun;
    void main(){
      float h = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 c = mix(uLow, uMid, smoothstep(0.42, 0.56, h));
      c = mix(c, uTop, smoothstep(0.55, 0.95, h));
      float s = pow(max(dot(normalize(vDir), normalize(uSun)), 0.0), 8.0);
      c += vec3(1.0, 0.72, 0.42) * s * 0.55;
      gl_FragColor = vec4(c, 1.0);
    }`,
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(4000, 48, 32), skyMat));

// ground
const g = new THREE.PlaneGeometry(6000, 6000, 200, 200);
const p = g.attributes.position;
for (let i = 0; i < p.count; i++) {
  const x = p.getX(i), y = p.getY(i);
  p.setZ(i, Math.sin(x * 0.0016) * 60 + Math.cos(y * 0.0022) * 40 + Math.sin(x * 0.008 + y * 0.006) * 14);
}
g.computeVertexNormals();
const ground = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color: 0x2b2018, roughness: 0.9}));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// emissive object to test bloom
const orb = new THREE.Mesh(new THREE.SphereGeometry(46, 48, 32), new THREE.MeshStandardMaterial({color: 0x1a1208, emissive: 0xffb050, emissiveIntensity: 3.2, roughness: 0.4}));
orb.position.set(-120, 80, -260);
scene.add(orb);

const sun = new THREE.DirectionalLight(0xffd2a0, 3.0);
sun.position.set(-500, 420, 300);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x9ec4d8, 0x2a1c12, 0.6));

// filmic grade: grain + vignette + chromatic aberration + slight lift
const Grade = {
  uniforms: {tDiffuse: {value: null}, uTime: {value: 0}, uGrain: {value: 0.055}, uVig: {value: 0.5}, uCA: {value: 0.0016}},
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime, uGrain, uVig, uCA; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main(){
      vec2 d = vUv - 0.5;
      float r2 = dot(d, d);
      vec2 off = d * uCA * (1.0 + r2 * 2.0);
      vec3 col;
      col.r = texture2D(tDiffuse, vUv + off).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - off).b;
      float vig = smoothstep(0.95, 0.25, length(d) * 1.28);
      col *= mix(1.0, vig, uVig);
      float n = hash(vUv * vec2(1920.0, 1080.0) + uTime * 91.7);
      col += (n - 0.5) * uGrain;
      col = clamp(col, 0.0, 1.0);
      gl_FragColor = vec4(col, 1.0);
    }`,
};

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.55, 0.7, 0.72);
composer.addPass(bloom);
const grade = new ShaderPass(Grade);
composer.addPass(grade);

window.film = {
  ready: true, duration: 10, fps: 30,
  seek(t) {
    cam.position.x = Math.sin(t * 0.25) * 90;
    cam.position.y = 100 + Math.sin(t * 0.4) * 25;
    cam.lookAt(0, 70, -200);
    grade.uniforms.uTime.value = t;
    composer.render();
  },
  luma() {
    const gl = renderer.getContext();
    const buf = new Uint8Array(4 * 16 * 16);
    gl.readPixels(0, 0, 16, 16, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    let s = 0;
    for (let i = 0; i < buf.length; i += 4) s += 0.2126 * buf[i] + 0.7152 * buf[i + 1] + 0.0722 * buf[i + 2];
    return s / (buf.length / 4);
  },
};
window.film.seek(0);
</script>
</body></html>
