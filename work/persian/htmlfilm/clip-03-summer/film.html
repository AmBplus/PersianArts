<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>clip-03 summer — یک دانه</title>
<style>
@font-face{font-family:"PAHead";src:url("../fonts/Vazirmatn-Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
html,body{margin:0;height:100%;background:#0a0b0d;overflow:hidden}
canvas{position:absolute;left:0;top:0}
</style>
<script src="../lib/pa-motion.js"></script>
<script src="../lib/pa-film.js"></script>
</head>
<body>
<canvas id="cv"></canvas>
<script>
"use strict";
/* clip-03 «تابستان» — the same seed, one season later.
   Craft upgrade over clip-02: a real light model (one sun drives shadow direction, shadow length and
   rim light), four parallax layers, per-leaf stagger, and a camera that pushes in on the payoff. */
const {clamp, lerp, ease, rng} = PA;
const FPS = 30, BPM = 118, BS = 60 / BPM, DURATION = 40 * BS;
const W = 1080, H = 1920;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
cv.width = W; cv.height = H;
const win = PF.win;

const C = {
  skyTop: "#20364a", skyMid: "#6b7f8a", skyLow: "#e8b877", skyHot: "#f7d9a4",
  sun: "#fff3cf", sunRim: "#ffc46b",
  hillFar: "#2f4a45", hillNear: "#1e312d", ground: "#3a4a34", groundLit: "#6d7d4a",
  trunk: "#4a3524", trunkLit: "#8a6038",
  leaf: "#5fae5c", leafLit: "#a8d06a", leafRim: "#f2d98a",
  ink: "#fbf4e6",
};
const GROUND = H * 0.795;
const TREE = {x: W * 0.50, y: GROUND};

const R = rng(20261020);
const grass = Array.from({length: 120}, () => ({x: R() * W, h: 18 + R() * 46, lean: (R() - 0.5) * 1.1, ph: R() * 6.3}));
const birds = Array.from({length: 5}, (_, i) => ({t0: 8.2 + i * 0.45, y: H * (0.20 + R() * 0.12), sp: 0.55 + R() * 0.35, s: 12 + R() * 8}));
const motes = Array.from({length: 70}, () => ({x: R() * W, y: GROUND - R() * H * 0.55, r: 1.2 + R() * 2.6, ph: R() * 6.3, sp: 0.3 + R() * 0.7}));

// ---- light model ---------------------------------------------------------------------------
// one sun for the whole film: its angle drives everything else (shadow, rim, sky, beam colour)
const sunA = (t) => lerp(0.16, 0.86, ease.inOutSine(win(t, 0, DURATION))) * Math.PI;
const sunPos = (t) => {
  const a = sunA(t), cx = W * 0.5, cy = GROUND - 40, r = H * 0.52;
  return {x: cx + Math.cos(a) * r, y: cy - Math.sin(a) * r * 1.02, a, elev: Math.sin(a)};
};

function drawSky(t) {
  const s = sunPos(t), elev = s.elev;
  const g = ctx.createLinearGradient(0, 0, 0, GROUND + 60);
  g.addColorStop(0, mixHex(C.skyTop, "#2b4a63", 1 - elev * 0.4));
  g.addColorStop(0.45, mixHex(C.skyMid, "#9fb0ae", elev * 0.55));
  g.addColorStop(0.82, mixHex(C.skyLow, C.skyHot, elev * 0.5));
  g.addColorStop(1, mixHex("#c98f5a", "#ffdca8", elev * 0.6));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND + 80);

  // sun: hot core + two halos, all soft (no polygon edge anywhere)
  const core = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 150);
  core.addColorStop(0, "rgba(255,251,235,1)");
  core.addColorStop(0.16, "rgba(255,240,196,0.95)");
  core.addColorStop(0.5, "rgba(255,196,110,0.35)");
  core.addColorStop(1, "rgba(255,170,80,0)");
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(s.x, s.y, 150, 0, 6.2832); ctx.fill();
  const halo = ctx.createRadialGradient(s.x, s.y, 20, s.x, s.y, 720);
  halo.addColorStop(0, "rgba(255,214,150,0.22)");
  halo.addColorStop(0.5, "rgba(255,190,120,0.08)");
  halo.addColorStop(1, "rgba(255,170,90,0)");
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(s.x, s.y, 720, 0, 6.2832); ctx.fill();
  ctx.restore();
}
function mixHex(a, b, k) {
  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  return `rgb(${pa.map((v, i) => Math.round(lerp(v, pb[i], clamp(k)))).join(",")})`;
}

function drawHills(t) {
  const s = sunPos(t);
  // far ridge
  ctx.fillStyle = C.hillFar;
  ctx.beginPath(); ctx.moveTo(-20, GROUND);
  for (let x = -20; x <= W + 20; x += 26) ctx.lineTo(x, GROUND - 120 - 46 * Math.sin(x * 0.0028 + 1.2) - 22 * Math.sin(x * 0.009));
  ctx.lineTo(W + 20, GROUND + 40); ctx.lineTo(-20, GROUND + 40); ctx.closePath(); ctx.fill();
  // near ridge with a sun-side rim
  ctx.fillStyle = C.hillNear;
  ctx.beginPath(); ctx.moveTo(-20, GROUND + 20);
  for (let x = -20; x <= W + 20; x += 22) ctx.lineTo(x, GROUND - 52 - 30 * Math.sin(x * 0.004 + 0.4) - 12 * Math.sin(x * 0.013));
  ctx.lineTo(W + 20, GROUND + 60); ctx.lineTo(-20, GROUND + 60); ctx.closePath(); ctx.fill();
  ctx.save();
  ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.35;
  ctx.strokeStyle = C.leafRim; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let x = -20; x <= W + 20; x += 22) {
    const y = GROUND - 52 - 30 * Math.sin(x * 0.004 + 0.4) - 12 * Math.sin(x * 0.013);
    x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke(); ctx.restore();
  void s;
}

function drawGround(t) {
  const g = ctx.createLinearGradient(0, GROUND - 20, 0, H);
  g.addColorStop(0, C.groundLit); g.addColorStop(0.35, C.ground); g.addColorStop(1, "#1b2419");
  ctx.fillStyle = g; ctx.fillRect(0, GROUND, W, H - GROUND);
  // grass blades, staggered sway
  for (const b of grass) {
    const sway = Math.sin(t * 1.6 + b.ph) * 6;
    ctx.strokeStyle = `rgba(${120 + (b.h % 30)},${150 + (b.h % 40)},90,0.55)`;
    ctx.lineWidth = 2.4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(b.x, GROUND + 6);
    ctx.quadraticCurveTo(b.x + b.lean * 14 + sway, GROUND - b.h * 0.6, b.x + b.lean * 26 + sway * 1.5, GROUND - b.h);
    ctx.stroke();
  }
}

// ---- tree ----------------------------------------------------------------------------------
const LEAVES = (() => {
  const out = [];
  const branch = (x, y, ang, len, w, depth) => {
    const ex = x + Math.sin(ang) * len, ey = y - Math.cos(ang) * len;
    out.push({type: "branch", x, y, ex, ey, w, depth});
    if (depth >= 3) {
      const n = depth === 3 ? 5 : 3;
      for (let i = 0; i < n; i++) {
        const a2 = ang + (i - (n - 1) / 2) * 0.55 + (R() - 0.5) * 0.2;
        out.push({type: "leaf", x: ex, y: ey, ang: a2, len: 54 + R() * 30, wid: 20 + R() * 10, d: R() * 0.35, ph: R() * 6.3});
      }
      return;
    }
    const kids = depth === 0 ? 3 : 2;
    for (let i = 0; i < kids; i++) {
      const a2 = ang + (i - (kids - 1) / 2) * 0.62 + (R() - 0.5) * 0.12;
      branch(ex, ey, a2, len * (0.62 + R() * 0.12), w * 0.62, depth + 1);
    }
  };
  branch(TREE.x, TREE.y, 0, 330, 30, 0);
  return out;
})();

function drawTree(t) {
  const s = sunPos(t);
  const grow = ease.outCubic(win(t, 0.2, 3.2)); // trunk draws itself in on the first beats
  const lit = clamp(0.35 + 0.65 * s.elev);
  // shadow on the ground, opposite the sun; longer when the sun is low
  const dir = s.x < TREE.x ? 1 : -1;
  const len = clamp(520 / Math.max(0.22, s.elev), 300, 1500);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, GROUND - 10, W, H - GROUND + 10); ctx.clip();
  const sg = ctx.createLinearGradient(TREE.x, GROUND, TREE.x + dir * len, GROUND);
  sg.addColorStop(0, "rgba(12,16,10,0.55)"); sg.addColorStop(1, "rgba(12,16,10,0)");
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.moveTo(TREE.x - 26, GROUND + 4);
  ctx.quadraticCurveTo(TREE.x + dir * len * 0.5, GROUND + 26, TREE.x + dir * len, GROUND + 8);
  ctx.lineTo(TREE.x + dir * len * 0.8, GROUND + 74);
  ctx.quadraticCurveTo(TREE.x + dir * len * 0.35, GROUND + 62, TREE.x + 26, GROUND + 30);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // branches + leaves, drawn in reveal order with a per-leaf stagger
  for (const b of LEAVES) {
    if (b.type === "branch") {
      const p = ease.outCubic(win(t, 0.2 + b.depth * 0.45, 1.0 + b.depth * 0.45));
      if (p <= 0) continue;
      ctx.strokeStyle = mixHex(C.trunk, C.trunkLit, lit * 0.8);
      ctx.lineWidth = b.w * (0.5 + 0.5 * p);
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(b.x, b.y);
      ctx.lineTo(lerp(b.x, b.ex, p), lerp(b.y, b.ey, p)); ctx.stroke();
    }
  }
  for (const l of LEAVES) {
    if (l.type !== "leaf") continue;
    const p = ease.outBack(win(t, 2.6 + l.d * 2.4, 3.2 + l.d * 2.4));
    if (p <= 0.01) continue;
    const flutter = Math.sin(t * 2.1 + l.ph) * 0.09;
    const toSun = Math.atan2(s.y - l.y, s.x - l.x);
    // rim light: the half of the leaf facing the sun is lit
    ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.ang + flutter);
    ctx.scale(p, p);
    const g = ctx.createLinearGradient(0, -l.wid, 0, l.wid);
    g.addColorStop(0, C.leafLit); g.addColorStop(0.55, C.leaf); g.addColorStop(1, "#3c7a45");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(l.len * 0.45, -l.wid, l.len, 0);
    ctx.quadraticCurveTo(l.len * 0.45, l.wid, 0, 0);
    ctx.fill();
    ctx.strokeStyle = `rgba(255,238,190,${0.35 * lit})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(l.len * 0.92, 0); ctx.stroke();
    ctx.restore();
    void toSun;
  }
}

function drawMotes(t) {
  for (const m of motes) {
    const y = m.y - ((t * m.sp * 22) % 260);
    const a = 0.12 + 0.2 * (0.5 + 0.5 * Math.sin(t * 1.7 + m.ph));
    ctx.fillStyle = `rgba(255,236,186,${a})`;
    ctx.beginPath(); ctx.arc(m.x + Math.sin(t * 0.7 + m.ph) * 14, y, m.r, 0, 6.2832); ctx.fill();
  }
}

function drawBirds(t) {
  ctx.save(); ctx.strokeStyle = "rgba(30,38,40,0.75)"; ctx.lineWidth = 3; ctx.lineCap = "round";
  for (const b of birds) {
    const p = win(t, b.t0, b.t0 + 7.5);
    if (p <= 0 || p >= 1) continue;
    const x = lerp(-120, W + 120, p), y = b.y + Math.sin(p * 6 + b.t0) * 18;
    const flap = Math.sin(t * 7 + b.t0 * 4) * 0.5 + 0.5;
    ctx.beginPath();
    ctx.moveTo(x - b.s, y + b.s * 0.4 * flap);
    ctx.quadraticCurveTo(x, y - b.s * 0.5 * flap, x + b.s, y + b.s * 0.4 * flap);
    ctx.stroke();
  }
  ctx.restore();
}

// ---- copy ----------------------------------------------------------------------------------
const BODY = PF.typeQueue([
  {txt: "آفتاب بالا می‌آید", t0: 2.5, t1: 6.0, y: 0.135},
  {txt: "هر برگ، یک آینه", t0: 7.5, t1: 10.5, y: 0.135},
  {txt: "سایه‌ات هم رشد می‌کند", t0: 12.0, t1: 15.5, y: 0.135},
], {gap: 0.5});
const HERO = {t0: 17.2, t1: DURATION + 1, main: "تابستان", sub: "و تو بلندتر از دیروز"};

function drawCopy(t) {
  for (const ln of BODY) {
    const a = ease.outCubic(win(t, ln.t0, ln.t0 + 0.45)) * (1 - ease.inCubic(win(t, ln.t1 - 0.45, ln.t1)));
    if (a <= 0.004) continue;
    ctx.save();
    ctx.shadowColor = "rgba(20,14,8,0.65)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 3;
    PF.drawLine(ctx, {text: ln.txt, x: W / 2, y: H * ln.y, px: 96, weight: 700, color: C.ink, alpha: a, t, t0: ln.t0, stagger: 0.05, dur: 0.4, maxW: W - 200});
    ctx.restore();
  }
  const a = ease.outCubic(win(t, HERO.t0, HERO.t0 + 0.6)) * (1 - ease.inCubic(win(t, HERO.t1 - 0.6, HERO.t1)));
  if (a > 0.004) {
    ctx.save();
    ctx.shadowColor = "rgba(255,214,150,0.5)"; ctx.shadowBlur = 46;
    PF.drawLine(ctx, {text: HERO.main, x: W / 2, y: H * 0.20, px: 250, weight: 900, color: "#ffe6b8", alpha: a, t, t0: HERO.t0, stagger: 0, dur: 0.55, rise: 0.2, maxW: W - 260});
    ctx.shadowColor = "rgba(20,14,8,0.7)"; ctx.shadowBlur = 22;
    PF.drawLine(ctx, {text: HERO.sub, x: W / 2, y: H * 0.20 + 110, px: 90, weight: 600, color: C.ink, alpha: a, t, t0: HERO.t0 + 0.3, stagger: 0.05, dur: 0.45, maxW: W - 200});
    ctx.restore();
  }
}

// ---- frame ---------------------------------------------------------------------------------
const camPush = (t) => 1 + 0.055 * ease.inOutSine(win(t, 0, DURATION));

function seek(t) {
  t = clamp(t, 0, DURATION);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  const z = camPush(t);
  ctx.translate(W / 2, H * 0.55); ctx.scale(z, z); ctx.translate(-W / 2, -H * 0.55);

  drawSky(t);
  drawHills(t);
  drawBirds(t);
  drawGround(t);
  drawTree(t);
  drawMotes(t);

  // light shafts through the canopy: three soft beams aimed along the sun direction
  const s = sunPos(t);
  const beamA = 0.10 + 0.20 * clamp(s.elev);
  PF.beam(ctx, s.x, s.y, s.a + Math.PI * 0.5 - 0.25, 1900, 300, "rgba(255,226,168,ALPHA)", beamA, Math.sin(t * 0.6) * 0.02);
  PF.beam(ctx, s.x, s.y, s.a + Math.PI * 0.5 + 0.12, 1700, 200, "rgba(255,214,150,ALPHA)", beamA * 0.8, Math.sin(t * 0.6 + 1) * 0.02);
  PF.beam(ctx, s.x, s.y, s.a + Math.PI * 0.5 + 0.42, 1500, 140, "rgba(255,206,140,ALPHA)", beamA * 0.6, Math.sin(t * 0.6 + 2) * 0.02);
  ctx.restore();

  // heat shimmer: thin horizontal bands that drift, strongest at midday
  const heat = 0.5 + 0.5 * Math.sin(win(t, 0, DURATION) * Math.PI);
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 5; i++) {
    const y = GROUND - 30 - i * 46 + Math.sin(t * 3 + i) * 4;
    ctx.fillStyle = `rgba(255,220,170,${0.020 * heat})`;
    ctx.fillRect(0, y, W, 22);
  }
  ctx.restore();

  PF.grain(ctx, W, H, t, {amount: 0.05});
  PF.vignette(ctx, W, H, {strength: 0.46});
  drawCopy(t);
}

window.film = {seek, duration: DURATION, fps: FPS, ready: true, copyAlpha: (t) => BODY.map((l) => ({txt: l.txt, a: +(ease.outCubic(win(t, l.t0, l.t0 + 0.45)) * (1 - ease.inCubic(win(t, l.t1 - 0.45, l.t1)))).toFixed(3)}))};
seek(0);
</script>
</body>
</html>
