<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S12 Pikavar route</title>
<!--
==========================================================================
S12 pikavar-route (own film, fictional brand, no client). ONE continuous take: camera moves, no cuts.
BOTH ratios from this one file: ?ratio=9x16 and ?ratio=16x9 (each composed in its own LAYOUT entry, never a crop).
120 BPM, 40 beats = 20.0 s = 600 frames. SILENT v1 (no audio in the file; sound deferred until the owner approves the picture).
==========================================================================
GOAL      same-day city pickup for small online sellers; desired action: order a pickup (پیک‌آور).
LOGLINE   «فاصله فقط یک عدد است» — one small parcel crosses the dark city while the counter falls to zero.
PROTAGONIST  one parcel (rounded box, amber tape, white hairline, soft glow, bob + squash on the kerbs). The route line is its wake
          (PA.pathFollow polyline in world units); the ETA counter is its heartbeat (1 s of story time = 1 unit on the dial).
CLOCK-TIE the counter is not a decoration: remaining = duration_s * (1 - prog(T, 0, DUR - 1/FPS)), so it reads exactly 0 on the last
          frame and pays off the number promised at 2 s. Every digit sits in an LTR isolate (docs/PERSIAN-LOCALIZATION-LESSONS.md 3/4).
MUSIC-LED silent v1: the beat grid (1 beat = 0.5 s) drives the route pulse, the district blooms and the dots on the line; no audio yet.
COPY      opening  «فاصله فقط یک عدد است.»  (fades over the first 2.6 s, out by 5.4 s)
          payoff   «رسید.»                  (stamps with the door at 18.8 s, stays on the last frame)
ART       night navy-teal map (#05121b -> #0b2b3a), faint streets #17455a, districts teal-glow -> warm when passed, route warm amber
          #ffb43c, parcel #ffe6b8 + #ff9a3c, type white #fff. Vazirmatn. Contrast: body white/amber on navy >= 4.5:1, large >= 3:1.
SCENES (120 BPM, beat 0.5 s)
  1 MAP     0-3 s      dark map, streets, district glow, the parcel small at its start; copy 1 in
  2 DRAW    3-9.5 s    the route draws itself behind the parcel, pulse dots run along the line, camera tracks and zooms in
  3 CROSS   9.5-14 s   the city lights pass: districts bloom warm as the line crosses them, camera tracks tight
  4 TURN    14-18.5 s  the last district hands over to the destination; the doorway light grows, the camera settles and pushes
  5 DOOR    18.5-20 s  the door opens (18.5), the parcel is handed over, the counter hits 0 (19.967 s) with the «رسید.» stamp
EVENTS (s) riser 3 | route live 3 | district bloom 9.5 | district bloom 12.5 | last handover 14 | door opens 18.5 | counter zero 19.967
==========================================================================
-->
<style>
@font-face{font-family:"PAHead";src:url("fonts/Vazirmatn-Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;transform-origin:0 0;direction:rtl}
canvas{position:absolute;left:0;top:0}
</style>
<script src="../lib/pa-motion.js"></script><script src="../lib/pa-camera.js"></script><script src="../lib/pa-layout.js"></script>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<script>
"use strict";
const {clamp, lerp, prog, ease, beats, rng, faDigits} = PA;
const params = new URLSearchParams(location.search), RATIO = params.get("ratio") === "16x9" ? "16x9" : "9x16";
const FPS = 30, DURATION = 600, DUR = DURATION / FPS, BPM = 120, T0 = 0, BS = beats(BPM).bs;
const LAST = DUR - 1 / FPS;                       // 19.9667 s: the counter reaches exactly 0 on the final frame
const TITLE = "فاصله فقط یک عدد است.", RECEIPT = "رسید.";
// ---------------- per-ratio layout table (each entry a real second composition)
const MAP = {x0: 0, y0: 0, x1: 2600, y1: 1700};
const LAYOUT = {
  // 9:16: portrait. counter HUD in the upper band (its own scrim), the map fills everything below, route crosses it
  // top-to-bottom and the parcel is framed in the lower half for the whole take.
  "9x16": {
    route: [[500, 800], [640, 860], [760, 940], [880, 900], [980, 960], [1100, 930], [1200, 1010], [1320, 1080], [1440, 1040], [1560, 1100], [1650, 1090]],
    cam: {z: [[0, 1.15], [4, 1.29], [10, 1.42], [15, 1.55], [18, 1.9], [20, 2.2]], cy: [[0, 859], [20, 1210]]},
    door: {x: 1650, y: 1090}, counter: {x: 520, y: 550, size: 300, labelY: 300, labelSize: 46, unitY: 680, unitSize: 42},
    title: {x: 540, y: 1500, size: 56, max: 880, lines: 2}, receipt: {x: 540, y: 1690, size: 104},
    scrim: {y: 200, h: 900}, bloomSize: [200, 132]
  },
  // 16:9: landscape re-composition — the city sits in a tall right-hand column with its own streets, the counter and
  // copy own the left. Not a crop: different route, different camera keys, different text boxes.
  "16x9": {
    route: [[1900, 430], [2170, 620], [1980, 800], [2220, 960], [2010, 1120], [2240, 1240], [2090, 1380], [2300, 1480]],
    cam: {z: [[0, 1.3], [4, 1.42], [10, 1.55], [15, 1.66], [18, 1.95], [20, 2.2]], cy: [[0, 750], [20, 1210]]},
    door: {x: 2320, y: 1520}, counter: {x: 470, y: 430, size: 288, labelY: 230, labelSize: 50, unitY: 570, unitSize: 44},
    title: {x: 700, y: 880, size: 66, max: 1000, lines: 2}, receipt: {x: 250, y: 170, size: 96},
    scrim: {x: 740, w: 520}, bloomSize: [210, 140]
  }
};
const L = PA.layout(LAYOUT, RATIO), W = L.W, H = L.H;
const EVENTS = [["riser", 3], ["route live", 3], ["city lights", 5], ["bloom 1", 9.5], ["bloom 2", 12.5], ["last handover", 14], ["door opens", 18.5], ["counter zero", LAST]]
  .map(([name, t]) => ({name, t_s: +t.toFixed(3), frame: Math.round(t * FPS)}));
const cv = document.getElementById("cv"); cv.width = W; cv.height = H; const ctx = cv.getContext("2d");
const stage = document.getElementById("stage"); stage.style.width = W + "px"; stage.style.height = H + "px";
// ---------------- route: the parcel's wake (PA.pathFollow)
const PF = PA.pathFollow(L.route), ROUTE = L.route;
const drawF = t => ease.inOutSine(prog(t, 0.6, 16.4));            // how much of the line exists at t
const parcelS = t => PF.len * ease.inOutSine(prog(t, 0, LAST));   // parcel distance along the line
const parcelP = t => PF.at(parcelS(t));
const travelPts = t => { const s = parcelS(t), out = []; for (const p of ROUTE) { if (Math.hypot(p[0] - ROUTE[0][0], p[1] - ROUTE[0][1]) <= s) out.push(p); else break; } return out.concat([[parcelP(t).x, parcelP(t).y]]); };
// ---------------- deterministic city (no Math.random anywhere)
const R = rng(12);
const STREETS = (() => { const v = [], h = [];
  for (let x = -200; x < MAP.x1 + 200; x += 58 + (R() * 46 | 0)) v.push({x, w: R() < 0.18 ? 3 : 1});
  for (let y = -200; y < MAP.y1 + 200; y += 64 + (R() * 52 | 0)) h.push({y, w: R() < 0.18 ? 3 : 1});
  return {v, h}; })();
const DISTRICT = (() => { const names = ["شهرک غرب", "ونک", "میرداماد", "جردن", "ولیعصر", "یوسف‌آباد", "هفت‌تیر", "سعادت‌آباد"];
  const pick = [0.12, 0.26, 0.40, 0.53, 0.66, 0.78, 0.89, 0.98];
  return names.map((n, i) => { const p = PF.at(PF.len * pick[i]); return {name: n, x: p.x + (i % 2 ? 120 : -130), y: p.y + (i % 3 === 0 ? -205 : i % 3 === 1 ? 185 : 20), pass: 0.6 + 16.2 * pick[i]}; }); })();
const DOTS = Array.from({length: 420}, () => ({x: R() * 2600, y: R() * 1700, r: 1 + R() * 3.4, a: 0.25 + R() * 0.55, w: R() < 0.4 ? 1 : 0, p: R() * 6}));
const BLD = Array.from({length: 120}, () => ({x: 130 + R() * 2320, y: 90 + R() * 1520, w: 74 + R() * 190, h: 46 + R() * 108, k: R() < 0.2 ? 1 : 0, light: R() < 0.3 ? 1 : 0}));
// ---------------- pre-rendered sprites (never per-frame blur or full-frame generates)
function radial(size, mid, outer) { const c = document.createElement("canvas"); c.width = c.height = size; const g = c.getContext("2d"); const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.5, mid); gr.addColorStop(1, outer); g.fillStyle = gr; g.fillRect(0, 0, size, size); return c; }
const GLOW_WARM = radial(256, "rgba(255,176,84,0.55)", "rgba(255,176,84,0)");
const GLOW_TEAL = radial(256, "rgba(96,206,236,0.30)", "rgba(96,206,236,0)");
const GLOW_DOOR = radial(256, "rgba(255,214,140,0.6)", "rgba(255,214,140,0)");
const NOISE = (() => { const c = document.createElement("canvas"); c.width = c.height = 96; const g = c.getContext("2d"); const id = g.createImageData(96, 96); const N = rng(7);
  for (let i = 0; i < id.data.length; i += 4) { const v = 118 + N() * 44; id.data[i] = v * 0.75; id.data[i + 1] = v * 0.92; id.data[i + 2] = v; id.data[i + 3] = N() < 0.45 ? 18 : 7; }
  g.putImageData(id, 0, 0); return ctx.createPattern(c, "repeat"); })();
// ---------------- drawing pieces (world space unless said otherwise)
function backdrop(p) {
  const z = p.z, wl = (W / z) * 1.15, hl = (H / z) * 1.15;              // bleeds past the map edge: no blank band, ever
  const g = ctx.createLinearGradient(p.cx - wl / 2, p.cy - hl / 2, p.cx + wl / 2, p.cy + hl / 2);
  g.addColorStop(0, "#04101a"); g.addColorStop(0.45, "#082430"); g.addColorStop(1, "#0b2b3a");
  ctx.fillStyle = g; ctx.fillRect(p.cx - wl / 2, p.cy - hl / 2, wl, hl);
}
function mapPlate() {
  ctx.fillStyle = "rgba(14,54,72,0.62)"; ctx.fillRect(MAP.x0, MAP.y0, MAP.x1 - MAP.x0, MAP.y1 - MAP.y0);
  const g = ctx.createRadialGradient(MAP.x1 * 0.45, MAP.y1 * 0.5, 200, MAP.x1 * 0.45, MAP.y1 * 0.5, MAP.x1 * 0.72);
  g.addColorStop(0, "rgba(16,80,104,0.55)"); g.addColorStop(0.62, "rgba(10,48,66,0.20)"); g.addColorStop(1, "rgba(3,14,22,0.62)");
  ctx.fillStyle = g; ctx.fillRect(MAP.x0, MAP.y0, MAP.x1 - MAP.x0, MAP.y1 - MAP.y0);
  ctx.strokeStyle = "rgba(140,224,246,0.42)"; ctx.lineWidth = 3; ctx.strokeRect(MAP.x0 + 2, MAP.y0 + 2, MAP.x1 - MAP.x0 - 4, MAP.y1 - MAP.y0 - 4);
}
function streets(p) {                                                     // dashed roads, like a real map sheet
  ctx.strokeStyle = "rgba(150,226,248,0.34)"; ctx.lineWidth = 1.7; ctx.setLineDash([15, 11]);
  ctx.beginPath(); for (const s of STREETS.v) { ctx.moveTo(s.x, MAP.y0 - 60); ctx.lineTo(s.x, MAP.y1 + 60); } ctx.stroke();
  ctx.strokeStyle = "rgba(150,226,248,0.27)";
  ctx.beginPath(); for (const s of STREETS.h) { ctx.moveTo(MAP.x0 - 60, s.y); ctx.lineTo(MAP.x1 + 60, s.y); } ctx.stroke();
  ctx.setLineDash([]); ctx.strokeStyle = "rgba(196,244,255,0.5)"; ctx.lineWidth = 4;
  ctx.beginPath(); for (const s of STREETS.v) if (s.w === 3) { ctx.moveTo(s.x, MAP.y0 - 60); ctx.lineTo(s.x, MAP.y1 + 60); } ctx.stroke();
}
function blocks(t) {                                                        // city fabric: blocks and their lit windows
  for (const b of BLD) {
    ctx.fillStyle = b.light ? "rgba(46,108,128,0.5)" : b.k ? "rgba(3,15,23,0.94)" : "rgba(7,28,40,0.9)"; ctx.fillRect(b.x, b.y, b.w, b.h);
    if (b.k) { ctx.fillStyle = "rgba(255,222,164,0.62)"; ctx.fillRect(b.x + 10, b.y + 12, 10, 7); ctx.fillRect(b.x + b.w - 22, b.y + b.h - 20, 10, 7); ctx.fillRect(b.x + b.w * 0.45, b.y + 8, 10, 7); }
  }
}
function dots(t) {                                                          // map texture: lamp points, so no band of the sheet is bare
  for (const d of DOTS) { ctx.fillStyle = d.w ? `rgba(255,216,150,${d.a * 0.7})` : `rgba(180,236,255,${d.a * 0.5})`;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill(); }
}
function districts(t, p) {
  for (const d of DISTRICT) {
    const pass = clamp(1 - Math.abs(t - d.pass) / 3.4), warm = smooth(prog(t, d.pass - 1.6, 1.4));
    const sw = L.bloomSize[0] * (0.82 + 0.18 * Math.sin(t * 2.1 + d.x)), sh = L.bloomSize[1] * (0.9 + 0.1 * warm);
    ctx.globalAlpha = 0.62; ctx.drawImage(warm > 0.4 ? GLOW_WARM : GLOW_TEAL, d.x - sw / 2, d.y - sh / 2, sw, sh); ctx.globalAlpha = 1;
    ctx.fillStyle = `rgba(224,248,255,${(0.40 + 0.5 * pass) * 0.72})`; ctx.font = `22px PAHead`; ctx.textAlign = "center"; ctx.direction = "rtl";
    ctx.fillText(d.name, d.x, d.y + 12);
  }
}
function rings(t, p) {                                                   // destination marker: known from frame 0
  const d = L.door, pul = (t * 0.75) % 1, a = 1 - pul;
  ctx.globalCompositeOperation = "lighter";
  ctx.strokeStyle = `rgba(255,186,96,${0.5 * a})`; ctx.lineWidth = 4 / p.z; ctx.beginPath(); ctx.arc(d.x, d.y - 35, 55 + 210 * pul, 0, 7); ctx.stroke();
  ctx.strokeStyle = `rgba(255,186,96,${0.45 * (1 - ((t * 0.75 + 0.5) % 1))})`; ctx.beginPath(); ctx.arc(d.x, d.y - 35, 55 + 210 * ((t * 0.75 + 0.5) % 1), 0, 7); ctx.stroke();
  ctx.globalCompositeOperation = "source-over";
}
function route(t, p) {
  const f = drawF(t), pts = travelPts(t), lw = 4.4 / p.z;
  const head = parcelP(t);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.globalCompositeOperation = "lighter";
  if (f > 0.002) {
    ctx.strokeStyle = "rgba(255,164,64,0.16)"; ctx.lineWidth = lw * 3.6; stroke(pts, head, f);
    ctx.strokeStyle = "rgba(255,190,96,0.5)"; ctx.lineWidth = lw * 1.9; stroke(pts, head, f);
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = "#ffc86a"; ctx.lineWidth = lw; stroke(pts, head, f);
  } else { ctx.globalCompositeOperation = "source-over"; }
  // pulse dots running along the line: the beat is visible on the route
  for (let i = 0; i < 7; i++) { const s = ((t * 0.32 + i / 7) % 1) * PF.len * f; if (s < 4 || f < 0.02) continue; const q = PF.at(s);
    ctx.globalCompositeOperation = "lighter"; ctx.drawImage(GLOW_WARM, q.x - 26, q.y - 26, 52, 52); ctx.globalCompositeOperation = "source-over"; }
  const rem = DUR * (1 - prog(t, 0, LAST));
  ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.55 + 0.45 * (t > LAST - 1.2 ? 1 : Math.abs(Math.sin(t * Math.PI)));
  ctx.drawImage(GLOW_WARM, head.x - 110, head.y - 110, 220, 220); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  // the parcel
  const bob = Math.abs(Math.sin(t * 3.1)) * 9, tilt = Math.sin(t * 2.3) * 0.09, done = prog(t, LAST - 0.35, 0.3), sc = 1 - 0.45 * done;
  ctx.save(); ctx.translate(head.x, head.y - 26 - bob); ctx.rotate(tilt); ctx.scale(sc, sc);
  ctx.fillStyle = "rgba(255,214,140,0.22)"; ctx.beginPath(); ctx.ellipse(0, 54, 62, 13, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#ff9a3c"; ctx.beginPath(); ctx.roundRect(-42, -36, 84, 84, 10); ctx.fill();
  ctx.fillStyle = "#ffe6b8"; ctx.fillRect(-42, -36, 84, 22);
  ctx.strokeStyle = "rgba(255,255,255,0.92)"; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.roundRect(-42, -36, 84, 84, 10); ctx.stroke();
  ctx.strokeStyle = "rgba(120,52,10,0.75)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-42, 0); ctx.lineTo(42, 0); ctx.stroke();
  ctx.restore();
  return rem;
}
function stroke(pts, head, f) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke(); }
function smooth(u) { return u * u * (3 - 2 * u); }
function door(t, p) {
  const d = L.door, open = smooth(prog(t, 18.5, 0.85)), spill = 0.25 + 0.75 * open;
  ctx.fillStyle = "#0a2534"; ctx.fillRect(d.x - 190, d.y - 330, 380, 330);                 // the building
  ctx.strokeStyle = "rgba(120,210,235,0.35)"; ctx.lineWidth = 3; ctx.strokeRect(d.x - 190, d.y - 330, 380, 330);
  ctx.fillStyle = "#123c4d"; ctx.fillRect(d.x - 62, d.y - 205, 124, 205);                  // the doorway
  const lg = ctx.createLinearGradient(d.x, d.y - 205, d.x, d.y + 120);
  lg.addColorStop(0, `rgba(255,226,168,${0.85 * spill})`); lg.addColorStop(1, `rgba(255,190,110,${0.12 * spill})`);
  ctx.fillStyle = lg; ctx.fillRect(d.x - 58, d.y - 201, 116, 201);
  ctx.globalCompositeOperation = "lighter";
  ctx.drawImage(GLOW_DOOR, d.x - 300 * spill, d.y - 320 * spill, 600 * spill, 600 * spill);
  ctx.globalAlpha = 0.5 * spill; ctx.beginPath(); ctx.ellipse(d.x, d.y + 26, 250 * spill, 62 * spill, 0, 0, 7); ctx.fillStyle = "#ffd68c"; ctx.fill(); ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  if (open > 0.05) {                                                                        // one silhouette, no face: it is the doorway, not a character
    ctx.fillStyle = `rgba(14,34,44,${0.85 * open})`;
    ctx.beginPath(); ctx.arc(d.x + 4, d.y - 150, 24, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(d.x - 34, d.y); ctx.lineTo(d.x - 26, d.y - 122); ctx.lineTo(d.x + 34, d.y - 122); ctx.lineTo(d.x + 42, d.y); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = "rgba(120,210,235,0.5)"; ctx.font = "40px PAHead"; ctx.textAlign = "center"; ctx.direction = "rtl";
  ctx.fillText("درب منزل", d.x, d.y + 96);
}
// ---------------- screen-space type
function wrap(text, maxW, size) { ctx.font = `800 ${size}px PAHead`; const words = text.split(" "), lines = []; let cur = "";
  for (const w of words) { const t2 = cur ? cur + " " + w : w; if (ctx.measureText(t2).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t2; } if (cur) lines.push(cur); return lines; }
function counter(t, rem) {
  const c = L.counter, n = Math.round(rem), done = prog(t, LAST - 0.25, 0.25);
  ctx.save(); ctx.shadowColor = `rgba(255,190,96,${0.55 + 0.35 * done})`; ctx.shadowBlur = 34 + 40 * done; ctx.textAlign = "center"; ctx.direction = "rtl";
  ctx.fillStyle = "rgba(255,196,110,0.92)"; ctx.font = `700 ${c.labelSize}px PAHead`; ctx.fillText("زمان تا تحویل", c.x, c.labelY);
  ctx.fillStyle = "#fff"; ctx.font = `900 ${c.size}px PAHead`;
  ctx.fillText(faDigits(n), c.x, c.y);                       // Persian digits in RTL logical order (NOT an LTR isolate: that mirrors the number)
  ctx.restore();
  ctx.textAlign = "center"; ctx.direction = "rtl"; ctx.fillStyle = "rgba(226,244,252,0.85)";
  ctx.font = `600 ${c.unitSize}px PAHead`; ctx.fillText("ثانیه", c.x - c.size * 1.15, c.unitY);   // unit beside the number: the parcel's path never crosses the type
}
function copy(t) {
  const c = L.title, a = prog(t, 0.3, 2.0) * (1 - prog(t, 4.6, 0.8));
  if (a > 0.01) { const lines = wrap(TITLE, c.max, c.size);
    ctx.globalAlpha = a; ctx.textAlign = "center"; ctx.direction = "rtl"; ctx.fillStyle = "#f2fbff";
    ctx.font = `800 ${c.size}px PAHead`; ctx.shadowColor = "rgba(2,12,20,0.95)"; ctx.shadowBlur = 18;
    lines.forEach((ln, i) => ctx.fillText(ln, c.x, c.y + i * c.size * 1.42)); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
  const r = prog(t, LAST - 1.1, 0.5), rc = L.receipt;
  if (r > 0.01) { const pop = 1 + 0.14 * Math.exp(-Math.max(0, t - (LAST - 1.1)) * 5);
    ctx.save(); ctx.globalAlpha = r; ctx.translate(rc.x, rc.y); ctx.scale(pop, pop); ctx.textAlign = "center"; ctx.direction = "rtl";
    ctx.fillStyle = "#fff"; ctx.font = `900 ${rc.size}px PAHead`; ctx.shadowColor = "rgba(255,190,96,0.95)"; ctx.shadowBlur = 36;
    ctx.fillText(RECEIPT, 0, 0); ctx.restore(); }
}
function screenFX(p, rem) {
  const s = L.scrim;
  const g = RATIO === "9x16" ? ctx.createLinearGradient(0, s.y, 0, s.y + s.h) : ctx.createLinearGradient(s.x, 0, s.x + s.w, 0);
  g.addColorStop(RATIO === "9x16" ? 0 : 0, "rgba(4,16,24,0.93)"); g.addColorStop(RATIO === "9x16" ? 0.55 : 0.45, "rgba(5,20,30,0.62)"); g.addColorStop(1, "rgba(5,20,30,0)");

  ctx.beginPath(); ctx.ellipse(W * (RATIO === "9x16" ? 0.35 : 0.3), H * 0.62, W * 0.5, H * 0.22, 0, 0, 7); ctx.fill();

const camZ = PA.keys(L.cam.z, ease.inOutSine), camCX = PA.keys([[0, L.route[0][0]], [20, L.door.x + 60]], ease.inOutSine), camCY = PA.keys(L.cam.cy, ease.inOutSine);
function render(n) {
