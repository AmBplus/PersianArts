<!--
==========================================================================
S10 «صنایع پارسا» v3 — ART-DIRECTION PASS (story, brand, beats, 20.000 s and
600 frames are UNCHANGED; only how the film LOOKS and MOVES changed).
One self-contained file serves BOTH ratios: ?ratio=9x16 (1080x1920) and
?ratio=16x9 (1920x1080) from a per-ratio RE-COMPOSITION table (never a crop).
120 BPM, FPB = 15 frames/beat, 9 hard cuts on CUT_BEATS = [0,4,8,12,16,22,28,34,36].
Silent. window.film.seek(t) renders round(t*30) as a pure function of t.
==========================================================================
FIX LOG v3 (vs v2; v1/v2 outputs untouched)

 #1 LIGHT (audit D1 / ranked fix 1)  v2 had a vignette and a "light shaft" that was a
    STRIPED ORANGE DECAL printed on the deck. v3 declares ONE key light in the header
    (top-right, #ffd8a6, very soft) and derives everything from it: the back wall is no
    longer a flat gradient but a VALUE RAMP across its width (the wall is measurably
    lighter toward the key: 0.02 -> 0.13 screen contribution left to right), every panel
    joint carries a lit edge on its key side only, the frame corners are darkened
    >= 10% L*, and the shaft is now a real ADDITIVE light pool with soft falloff on all
    four sides plus three nested cones for penumbra — no hard edges, no stripes. The old
    orange floor decal is deleted (it was also the film's largest orange area, which
    killed the accent budget).
 #2 END CARD (D10 / fix 2)  the hazard band crossed the ISO row and the partner row in
    BOTH ratios. The band is now a FOOTER strip below every text block with >= 34 px
    clearance, and it sits behind nothing. The dead upper wall now carries the film's
    world back into the frame: the same truss, the same warm work lamps (now with real
    additive pools), racking silhouettes, dust in the key, and a light spill from the
    gate. The end card also gets its own grid and its own type scale entry.
 #3 HERO SCALE + FOREGROUND + DEAD SPACE (D7 / fix 3)  the v2 billet was ~8% of frame
    area. The hero is now staged at ~29% of frame HEIGHT in GATE and ~48% in BORE
    (standard floor is 25%). Every scene gains a foreground occluder plane (out-of-focus
    steel bench edge, machine column, cable, straightedge, drill shaft) and the empty
    wall/floor was cut by moving the horizon and the floor line per scene and filling
    the lower frame with a bench/grate plane instead of a bare gradient.
 #4 MATERIALS KIT (D6 / fix 4)  new named treatments, no flat single-fill shape left:
      metal()      two-tone reflection + an ENVIRONMENT LINE (the reflected lamp row) +
                   a specular band along the light axis + a lit edge highlight + a
                   soft dual contact shadow
      glow()       additive radial with a 4-stop falloff (core/hot/outer/0), used for
                   the emissive orange port, every work lamp, sparks and the shaft
      sawBlade()   a REAL blade: varied tooth geometry (3 alternating pitches), a
                   specular arc on the lit side, a rim, an arbor, a guard, and a cast
                   shadow on the wall behind it. v2 drew a white semicircle + ticks.
      concrete()   wall/floor planes with a value ramp, panel joints, grain
      scrim()      a knock-out/scrim behind any text sitting over scenery
 #5 TEMPLATE BROKEN (D8 / fix 5)  v2 played ONE stage nine times. v3 gives every scene
    its own framing family, horizon, background family, hero scale band and entrance
    direction (see the scene table in the header below). No two consecutive scenes
    share framing, background family or entrance direction.
 #6 TYPE HIERARCHY (D2 / fix 6)  a real named scale per ratio: display / headline /
    deck / label / legal / numeral / button. v2 had headline + "subtitle = headline at
    40%". The deck is now weight 300 at 34-36 px with its own colour; the label role is
    weight 600 with an accent rule above it; the adjacent pair headline(700/66) vs deck
    (300/34) differs by 400 weight AND 1.94x size (two-axis contrast, standard S2).
    Tracking is applied to LATIN runs only — Persian is connected script and tracking
    breaks the joins (docs/PERSIAN-LOCALIZATION-LESSONS.md), so Persian hierarchy is
    carried by weight/size/colour and the label rule instead. Every numeral run goes
    through iso() (U+2066/U+2069 LTR isolate + ctx.direction="ltr"); PA.ltr() returns
    HTML and cannot be used inside a canvas fillText, so iso() is its canvas twin.
 #7 COPY-PASTE PROPS (fix 7)  the three identical mini billets at 1/4 scale are gone.
    The PALLET scene now has a real row: per-part width/height/rotation/occlusion
    variation, staggered depth, one part deliberately cropped by the foreground beam.
    The finale's pallet is the same idea at a different angle, not a repeat.
 #8 SECONDARY ACTION (fix 8)  spring()/outBack() on every physical arrival: the billet
    anticipates 8 px against its direction then SPRINGS into place (k=95 d=0.42) with a
    slight roll; the saw and drill use outBack on the plunge; the stamp uses spring with
    squash on the part; dust and the light pools FOLLOW THROUGH (they settle 5-7 frames
    after the prop has stopped), and the pallet row staggers 70 ms apart.
 #9 GRADE (fix 9)  a real grade pass at the end of the frame: cool shadow multiply
    (fill token at 20%), warm highlight screen centred on the key, ambient corner
    falloff. The workshop is warm, the shadows are cool, and orange is held to a budget:
    only the port, lamp cores, sparks, the CTA, the logo, the hazard footer and the
    small label rules are orange. v2's big orange floor polygon is deleted.
 #10 TOKENS (fix 10)  every colour is a CSS custom property in :root and mirrored 1:1 in
    the JS palette P (no ad-hoc hex outside P; the rgba() calls composite an existing
    token, they do not introduce a colour).
 #11 SHADER (story-driven)  ONE shader transition, BowTieHorizontal, straddles the
    f60 CUT: the bow-tie closes from both edges like the saw pinching the frame shut —
    a shear, not a dissolve. It runs only over f54..f65 (12 frames). Every other cut
    stays a hard cut on the beat. The two scene layers are rendered to two buffers and
    the GL result is composited; the type layer cross-fades on the same progress.
 #12 CAMERA (pa-camera)  a genuine keyframed camera: keyframed zoom tracks for BORE
    (macro push-in 1.00 -> 1.14) and SHIP (pull-back 1.06 -> 0.90), plus a keyframed
    timing on every cut push. Camera never touches the type layer, so text stays sharp.
 #13 v2 BEHAVIOUR KEPT  the tolerance number is still drawn inside an explicit LTR
    isolate with ctx.direction="ltr" and the Persian unit میلی‌متر (v2 F1), it still
    enters f206 and leaves f258 (v2 F2), and the partner stand-in row still renders
    from f562 (v2 F3).
==========================================================================
ART-DIRECTION STANDARD §1-§5 — FILLED IN (a blank field would be a build error)

PALETTE (tokens, ratio 60 page / 30 surface / 10 accent+signal)
  --page  #141a21  workshop field (hue 213, a hue, not a grey)
  --surface #333d49  (L* 23.6 vs page L* 10.1 => 13.5 L* apart, >= 12 ok)
  --surface-2 #46515f   --steel #6e7a87   --white #eef2f5 (THE only white)
  --ink #080b0f   --shadow-1 #101620  --shadow-2 #0a0f17  --shadow-3 #05080c
     (shadows are the page hue, darker; never black, never grey)
  --key #ffd8a6 warm key   --key-hot #fff0d2 lamp cores   --fill #3f6d92 cool fill
  --accent #ff7a1a brand orange (logo + CTA + emissive port ONLY)
  --signal #63d8f0 cold measurement cyan, max 2 uses per scene (MEASURE/INSPECT only)
  HERO-CONTRAST FRAME: f583 (19.433 s) — the end card, where display type + mark + key
  spill + product still-life all peak. No other frame claims it.

LIGHT (declared)
  KEY    top-right (lamp row at x = 0.72 W), #ffd8a6, very soft, intensity 1.00.
         Light axis vector (+0.55, -0.83): lit upper-right, core shadow lower-left.
  FILL   18 %, #3f6d92, from lower-left (bounce off the deck)
  RIM    on, 4 px at 1080 width, on the key-facing edge only
  AMBIENT the darkest shadow may reach #0a0f17 (never pure black)
  ATMOSPHERE  dust in the key shaft, drawn both BEHIND and IN FRONT of the subject

TYPE SCALE (per ratio, see LAYOUT[ratio].type; two-axis contrast mandatory)
  display  900  92px  -0.02em  --white     one line per film
  headline 700  66px  -0.01em  --white     scene titles
  deck     300  34px   0       --light     the line under a headline
  label    600  22px  + rule   --signal / --accent   overlines
  legal    300  17px  +0.02em  --white@62%
  numeral  900 112px           --white     counters and stats
  button   600  32px           --ink on --accent
  HUD ANCHOR: the label/headline/deck rail is right-anchored at x = W - 72 (9:16) and
  W - 96 (16:9) and NEVER moves between scenes. The RTL anchor is preserved in both.

SCENES (framing family | background family | hero scale band | entrance direction)
  1 GATE    f0    med-wide, eye level       | shop wall + racking + key shaft | 29% H | billet slides from LEFT
  2 CUT     f60   LOW ANGLE (horizon .62H)  | dark machine bay, saw dominant  | 24% H | saw plunges from TOP
  3 MACHINE f120  profile / side-on         | backlit panel grid (brightest)  | 22% H | gantry enters from RIGHT
  4 MEASURE f180  macro, shallow            | instrument bay, near-black      | 33% H | jaws close from L + R
  5 BORE    f240  extreme macro + push-in   | black + orange pool only        | 48% H | drill descends from TOP
  6 INSPECT f330  plan / overhead           | bench plane + overhead pool     | 30% H | part slides in from LEFT
  7 PALLET  f420  wide, high 20 deg         | hall depth, racking both sides  | 26% H | sling lowers from TOP
  8 SHIP    f510  very wide + pull-back     | whole hall, the gate opens warm | 18% H | everything recedes
  9 MARK    f540  end-card grid             | same world, key spill + still   | 22% H | mark scales up (outBack)
==========================================================================
-->
<style>
:root{
  --page:#141a21; --page-2:#1d2530; --surface:#333d49; --surface-2:#46515f; --steel:#6e7a87;
  --white:#eef2f5; --light:#a9b4c0; --ink:#080b0f;
  --shadow-1:#101620; --shadow-2:#0a0f17; --shadow-3:#05080c;
  --key:#ffd8a6; --key-hot:#fff0d2; --fill:#3f6d92;
  --accent:#ff7a1a; --accent-deep:#c94f06; --signal:#63d8f0;
}

<script src="../lib/pa-motion.js"></script><script src="../lib/pa-layout.js"></script>
<script src="../lib/pa-camera.js"></script><script src="../lib/pa-fx.js"></script>
<script src="../lib/shaders/index.js"></script>

<body>
<div id="stage"><canvas id="cv"></canvas></div>
<script>
"use strict";
const {clamp, lerp, prog, ease, rng, faDigits} = PA;
// LTR isolate for EVERY numeral run. PA.ltr() returns an HTML span and cannot be used inside a canvas
// fillText, so iso() is its canvas twin: the same U+2066/U+2069 isolate drawn with ctx.direction="ltr".
const iso = s => "\u2066" + s + "\u2069";
const params = new URLSearchParams(location.search), RATIO = params.get("ratio") === "16x9" ? "16x9" : "9x16";
const FPS = 30, DURATION = 600, DUR = DURATION / FPS, BPM = 120, T0 = 0, FPB = FPS * 60 / BPM; // 15 frames/beat

/* ---------------- PALETTE TOKENS (mirror of :root; the ONLY place a colour is written) ------- */
const P = {
  page:"#141a21", page2:"#1d2530", surface:"#333d49", surface2:"#46515f", steel:"#6e7a87",
  white:"#eef2f5", light:"#a9b4c0", ink:"#080b0f",
  shadow1:"#101620", shadow2:"#0a0f17", shadow3:"#05080c",
  key:"#ffd8a6", keyHot:"#fff0d2", fill:"#3f6d92",
  accent:"#ff7a1a", accentDeep:"#c94f06", signal:"#63d8f0"
};
const hex2rgb = h => h.charAt(0) === "#" ? [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)] : h.slice(4,-1).split(",").map(Number);
const rgba = (h, a) => { const c = hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const mixHex = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`; };

/* ---------------- per-ratio RE-COMPOSITION table (own geometry, own type, own end-card grid) -- */
const LAYOUT = {
  "9x16": {
    horizon: 640, floorY: 1230, groundY: 1080, margin: 72,
    machine: [560, 980], keyX: 0.72,
    type: {display:92, headline:66, deck:34, label:22, legal:17, numeral:112, button:32},
    copy: {labelY:196, headY:272, deckY:328},
    num: {x:540, y:640},
    end: {
      display:{x:1008,y:700}, rule:{x:1008,y:748,w:300},
      mark:{x:1008,y:940,r:92}, wm:{x:1008,y:1112}, tag:{x:1008,y:1160},
      cta:{x:674,y:1290,w:430,h:78}, partner:{y:1480,x0:540,gap:300},
      still:{x:300,y:996}, legal:{x:540,y:1620}, band:{y:1692,h:34}
    }
  },
  "16x9": {
    horizon: 400, floorY: 700, groundY: 640, margin: 96,
    machine: [990, 690], keyX: 0.70,
    type: {display:88, headline:72, deck:36, label:23, legal:18, numeral:124, button:34},
    copy: {labelY:176, headY:268, deckY:330},
    num: {x:1360, y:470},
    end: {
      display:{x:1824,y:300}, rule:{x:1824,y:352,w:340},
      mark:{x:1666,y:480,r:80}, wm:{x:1824,y:632}, tag:{x:1824,y:674},
      cta:{x:1598,y:764,w:452,h:78}, partner:{y:880,x0:1400,gap:290},
      still:{x:430,y:626}, legal:{x:300,y:936}, band:{y:992,h:26}
    }
  }
};
const L = PA.layout(LAYOUT, RATIO), W = L.W, H = L.H, WIDE = RATIO === "16x9";
const LT = L.type, MARGIN = L.margin;

/* ---------------- scene table: every cut is a hard cut on a beat ---------------- */
const CUT_BEATS = [0, 4, 8, 12, 16, 22, 28, 34, 36];
const F = b => Math.round(b * FPB);
const CUTS = CUT_BEATS.map(F);
const EVENTS = [
  ["gate", 0], ["cut", 4], ["chip", 4.5], ["machine", 8], ["backplate strike", 10],
  ["measure", 12], ["drill", 16], ["bore", 17], ["chamfer", 19], ["number lands", 20],
  ["inspect", 22], ["stamp", 23], ["pallet", 28], ["sling", 31], ["ship", 34],
  ["mark", 36], ["cta", 42], ["mark settle", 44]
].map(([name, b]) => ({name, beat: b, t_s: +(b * 60 / BPM).toFixed(4), frame: F(b)}));

const cv = document.getElementById("cv"); cv.width = W; cv.height = H;
const MAIN = cv.getContext("2d");
let ctx = MAIN;
const stage = document.getElementById("stage"); stage.style.width = W + "px"; stage.style.height = H + "px";
const sceneAt = n => { let i = 0; CUTS.forEach((c, k) => { if (n >= c) i = k; }); return i; };
const T = n => n / FPS;

/* ---------------- deterministic prop data ---------------- */
const R = rng(1017);
const chips = Array.from({length: 26}, () => ({a: R()*6.28, v: 0.5 + R()*0.9, s: 3 + R()*7}));
const barcode = Array.from({length: 44}, () => 0.8 + R()*1.7);
const dustA = Array.from({length: 110}, () => ({x:R(), y:R(), r:0.7 + R()*1.6, a:0.06 + R()*0.16, f:0.4 + R()*1.4, p:R()*6.28}));
const dustB = Array.from({length: 26}, () => ({x:R(), y:R(), r:1.6 + R()*3.4, a:0.05 + R()*0.10, f:0.25 + R()*0.7, p:R()*6.28}));
const grain = Array.from({length: 260}, () => ({x:R(), y:R(), w:1 + R()*2.6, h:0.6 + R()*1.6, a:0.02 + R()*0.05}));
// pallet row: three parts, deliberately NOT the same asset three times (audit fix 7)
const PALLET_ROW = [
  {dx:-1.00, dz:0.00, w:0.94, h:1.00, rot:-0.055, m:4,   occl:"none"},
  {dx:-0.06, dz:0.18, w:1.06, h:0.86, rot: 0.028, m:3.4, occl:"beam"},
  {dx: 0.86, dz:0.34, w:0.90, h:0.74, rot: 0.075, m:4,   occl:"part"}
];

/* ---------------- materials kit ---------------------------------------------------------------- */
function lg(x0,y0,x1,y1,stops){ const g = ctx.createLinearGradient(x0,y0,x1,y1); stops.forEach(([o,c]) => g.addColorStop(o,c)); return g; }
function rg(x,y,r0,r1,stops){ const g = ctx.createRadialGradient(x,y,r0,x,y,r1); stops.forEach(([o,c]) => g.addColorStop(o,c)); return g; }
// ADDITIVE glow with a real 4-stop falloff (core / hot / outer / zero). Never a flat disc.
function glow(x, y, r, col, a){
  if (a <= 0.004 || r <= 0.4) return;
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = rg(x, y, 0, r, [[0, rgba(col, 0.95*a)], [0.16, rgba(col, 0.52*a)], [0.46, rgba(col, 0.19*a)], [1, rgba(col, 0)]]);
  ctx.fillRect(x - r, y - r, r*2, r*2); ctx.restore();
}
// soft dual contact shadow: tight dark core + wide ambient occlusion. Everything grounded gets one.
function contact(x, y, rx, ry, a){
  ctx.save();
  ctx.fillStyle = rg(x, y, 0, rx, [[0, rgba(P.shadow3, 0.85*a)], [0.45, rgba(P.shadow3, 0.42*a)], [1, rgba(P.shadow3, 0)]]);
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill();
  ctx.fillStyle = rgba(P.shadow3, 0.55*a);
  ctx.beginPath(); ctx.ellipse(x, y, rx*0.42, ry*0.52, 0, 0, 7); ctx.fill();
  ctx.restore();
}
function scrim(x, y, w, h, a){
  ctx.save();
  ctx.fillStyle = rg(x, y, 0, Math.max(w, h)*0.9, [[0, rgba(P.shadow2, a)], [0.65, rgba(P.shadow2, a*0.75)], [1, rgba(P.shadow2, 0)]]);
  ctx.fillRect(x - w/2, y - h, w, h*2); ctx.restore();
}
// concrete/wall plane: base gradient + a VALUE RAMP along the light axis + panel joints with a lit edge
function concrete(x, y, w, h, o){
  o = o || {};
  const base = o.base || P.page, top = o.top || P.page2;
  ctx.fillStyle = lg(x, y, x, y + h, [[0, top], [0.55, base], [1, mixHex(base, P.shadow1, 0.55)]]);
  ctx.fillRect(x, y, w, h);
  ctx.save(); ctx.globalCompositeOperation = "screen";
  ctx.fillStyle = lg(x, 0, x + w, 0, [[0, rgba(P.fill, 0.02)], [0.55, rgba(P.key, 0.045)], [1, rgba(P.key, 0.13)]]);
  ctx.fillRect(x, y, w, h); ctx.restore();
  return function joints(cols, jw, alpha){
    for (let i = 0; i <= cols; i++){
      const px = x + (i*w/cols) + (jw || 0);
      ctx.fillStyle = rgba(P.shadow3, 0.30); ctx.fillRect(px, y, 3, h);
      ctx.fillStyle = rgba(P.light, (alpha || 0.10)); ctx.fillRect(px + 3, y, 2, h);
    }
  };
}
// real saw blade: varied tooth geometry + specular arc + rim + arbor + guard + cast shadow
function sawBlade(x, y, r, spin){
  ctx.save();
  ctx.fillStyle = rgba(P.shadow3, 0.40);
  ctx.beginPath(); ctx.ellipse(x - r*0.24, y + r*0.30, r*1.02, r*0.98, 0, 0, 7); ctx.fill();
  ctx.translate(x, y); ctx.rotate(spin);
  const N = 34;
  for (let i = 0; i < N; i++){
    const a = i*2*Math.PI/N, pitch = i % 3, len = r*(pitch === 0 ? 0.20 : pitch === 1 ? 0.13 : 0.165);
    const wdt = (2*Math.PI/N) * (pitch === 1 ? 0.34 : 0.52);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - wdt)*r, Math.sin(a - wdt)*r);
    ctx.lineTo(Math.cos(a + wdt*0.15)*(r + len), Math.sin(a + wdt*0.15)*(r + len));
    ctx.lineTo(Math.cos(a + wdt)*r, Math.sin(a + wdt)*r);
    ctx.closePath();
    ctx.fillStyle = lg(-r, -r, r, r, [[0, P.surface2], [0.5, P.steel], [1, P.surface]]);
    ctx.fill(); ctx.strokeStyle = rgba(P.shadow3, 0.5); ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7);
  ctx.fillStyle = lg(-r*0.7, -r*0.8, r*0.7, r*0.8, [[0, mixHex(P.surface,P.shadow2,0.4)], [0.42, P.steel], [0.62, P.light], [1, mixHex(P.surface,P.shadow2,0.5)]]);
  ctx.fill();
  ctx.strokeStyle = rgba(P.light, 0.75); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r - 2, -2.55, -1.05); ctx.stroke();
  ctx.strokeStyle = rgba(P.keyHot, 0.9); ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, r - 4, -2.35, -1.45); ctx.stroke();
  ctx.strokeStyle = rgba(P.shadow2, 0.65); ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(0, 0, r - 5, 0.75, 2.35); ctx.stroke();
  ctx.strokeStyle = rgba(P.shadow1, 0.5); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, r - 10, 0, 7); ctx.stroke();
  ctx.fillStyle = P.shadow1; ctx.beginPath(); ctx.arc(0, 0, r*0.20, 0, 7); ctx.fill();
  ctx.fillStyle = P.surface2; ctx.beginPath(); ctx.arc(0, 0, r*0.13, 0, 7); ctx.fill();
  ctx.fillStyle = rgba(P.accent, 0.9); ctx.fillRect(-r*1.02, -3, r*0.30, 6);
  ctx.restore();
}
/* ---------------- the hero: one billet, machined. THE metal treatment. ------------------------- */
function billetPath(cx, cy, w, h, m){
  const R0 = clamp(1 - m/1.1), k = clamp((m - 1.1)/2), ch = 12*k;
  const chf = u => (1 - Math.pow(Math.abs(2*u - 1), 5))*ch;
  const n = 22, pts = [];
  for (let i = 0; i <= n; i++){ const u = i/n, x = cx - w/2 + u*w;
    const jt = Math.sin(u*13.1 + 1.7)*3.2 + Math.sin(u*5.3 + 0.4)*2.0;
    pts.push([x, cy - h/2 - jt*R0 + chf(u)]); }
  for (let i = n; i >= 0; i--){ const u = i/n, x = cx - w/2 + u*w;
    const jb = Math.sin(u*11.3 + 4.1)*3.4 + Math.sin(u*7.7 + 2.2)*1.8;
    pts.push([x, cy + h/2 - jb*R0 - chf(u)]); }
  ctx.beginPath(); pts.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.closePath();
}
function wall(n){ return [[0,0],[F(4),0],[F(8),0.9],[F(12),1.6],[F(19),2.6],[F(22),3.4],[F(34),3.7],[F(36),4]]
  .reduce((acc,[f,v]) => (n >= f ? v : acc), 0); }
// settle: anticipation (a few px against the direction) then a spring arrival with a slight roll
function settle(n, f0, k, d, dir){
  const p = (n - f0)/FPS; if (p < 0) return {v:0, roll:0, anti:0};

  if (s === 2){
    label("ماشین‌کاری", cx, yL, ent(CUTS[2] + 14), P.signal);
    headText("به اندازهٔ مو، دقیق.", cx, yH, LT.headline, ent(CUTS[2] + 4, 14));
    deckText("برش و تراش قطعه در یک مرحله", cx, yD, ent(CUTS[2] + 26, 14)*(1 - out(CUTS[3] - 8, 8)));
  }
  if (s === 3){
    label("اندازه‌گیری", cx, yL, ent(CUTS[3] + 12), P.signal);
    headText("رواداری", cx, yH, LT.headline, ent(CUTS[3] + 4, 12));
    deckText("گیج تماسی، خوانش دیجیتال", cx, yD, ent(CUTS[3] + 22, 14)*(1 - out(CUTS[4] - 6, 6)));
  }
  if (s === 4){
    label("پخ‌زنی", cx, yL, ent(CUTS[4] + 12), P.accent);
    headText("سوراخ‌کاری و پخ‌زنی", cx, yH, LT.headline*0.92, ent(CUTS[4] + 4, 14));
    deckText("پخ " + iso("۴۵") + " درجه — شعاع " + iso("۲") + " میلی‌متر", cx, yD, ent(CUTS[4] + 30, 16)*(1 - out(CUTS[5] - 6, 6)));
  }
  if (s === 5){
    label("کنترل کیفیت", cx, yL, ent(CUTS[5] + 12), P.signal);
    headText("بازرسی کیفی", cx, yH, LT.headline, ent(CUTS[5] + 4, 14));
    deckText("هر قطعه پیش از بسته‌بندی اندازه‌گیری می‌شود.", cx, yD, ent(CUTS[5] + 26, 16)*(1 - out(CUTS[6] - 8, 8)));
  }
  if (s === 6){
    label("بارگیری", cx, yL, ent(CUTS[6] + 12), P.accent);
    headText("بارگیری", cx, yH, LT.headline, ent(CUTS[6] + 4, 14));
    deckText("بسته‌بندی صنعتی، آمادهٔ ارسال", cx, yD, ent(CUTS[6] + 24, 16)*(1 - out(CUTS[7] - 6, 6)));
  }
  if (s === 7){
    headText("خط تولید، یک شیفت کامل", cx, yH, LT.headline*0.94, ent(CUTS[7] + 6, 14)*(1 - out(CUTS[8] - 10, 10)));
    deckText("ظرفیت ماهانه، تحویل قراردادی", cx, yD, ent(CUTS[7] + 20, 14)*(1 - out(CUTS[8] - 8, 8)));
  }
  copyMul = 1;
}
/* ---------------- end card: its own grid, own hierarchy, own safe area -------------------------- */
function finale(n){
  const t = T(n), a0 = prog(n, CUTS[8], 22), E = L.end;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = P.page; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = lg(0, 0, 0, H, [[0, mixHex(P.shadow2, P.page, 0.30)], [0.45, mixHex(P.page, P.shadow1, 0.25)], [1, P.shadow2]]);
  ctx.fillRect(0, 0, W, H);
  const joints = concrete(0, 0, W, L.floorY, {base:mixHex(P.page, P.shadow1, 0.2), top:mixHex(P.shadow1, P.page, 0.35)});
  joints(WIDE ? 12 : 8, 0, 0.10);
  trussAndLamps(n, WIDE ? 92 : 150, 5, 0.04, 0.96, {sc:1});
  racking(W*0.035, WIDE ? 200 : 300, L.floorY + 60, 1);
  racking(W*0.965, WIDE ? 200 : 300, L.floorY + 60, -1);
  floorPlane(n, L.floorY, {a:1});
  shaft(W*0.60, WIDE ? 80 : 140, H, W*0.24, W*0.90, 0.85);
  // product still life: the pallet row at a different angle, not a copy of scene 7
  const palA = prog(n, CUTS[8] + 8, 18);
  if (palA > 0.01){
    const px = E.still.x, py = E.still.y, sc = WIDE ? 1 : 0.86;
    ctx.save(); ctx.globalAlpha = 0.96*palA;
    ctx.fillStyle = mixHex(P.surface2, P.shadow2, 0.42); ctx.fillRect(px - 250*sc, py - 6, 500*sc, 26*sc);
    ctx.fillStyle = rgba(P.light, 0.32); ctx.fillRect(px - 250*sc, py - 11, 500*sc, 5);
    PALLET_ROW.forEach((pr, i) => {
      const st2 = ease.spring(clamp((n - CUTS[8] - 8 - i*2)/FPS/0.8, 0, 2), 70 + i*12, 0.44);
      billet(n, px + (i - 1)*168*sc, py - 54*sc - pr.dz*22 + lerp(-120, 0, st2), 158*sc*pr.w, 96*sc*pr.h, {m:4, rot:pr.rot*1.3});
    });
    ctx.restore();
  }
  const ms = 0.82 + 0.18*ease.outBack(a0);
  glow(E.mark.x, E.mark.y, E.mark.r*3.0, P.accent, 0.22*a0);
  glow(E.mark.x - E.mark.r*0.5, E.mark.y - E.mark.r*0.5, E.mark.r*2.4, P.key, 0.16*a0);
  ctx.save(); ctx.globalAlpha = a0; ctx.translate(E.mark.x, E.mark.y); ctx.scale(ms, ms); ctx.translate(-E.mark.x, -E.mark.y);
  mark(E.mark.x, E.mark.y, E.mark.r); ctx.restore();
  const mx = WIDE ? E.wm.x : E.mark.x;
  drawText("صنایع پارسا", mx, E.wm.y, {w:900, size:WIDE ? 66 : 64, col:P.white, alpha:prog(n, CUTS[8] + 6, 18), ls:-1});
  drawText("تولید قطعات صنعتی دقیق", mx, E.tag.y, {w:300, size:WIDE ? 26 : 25, col:P.light, alpha:prog(n, CUTS[8] + 10, 18)});
  drawText("از شمش تا اطمینان.", E.display.x, E.display.y, {w:900, size:LT.display, col:P.white, alpha:prog(n, CUTS[8] + 22, 20), ls:-LT.display*0.02, shadow:20});
  ctx.save(); ctx.globalAlpha = prog(n, CUTS[8] + 30, 16)*copyMul; ctx.strokeStyle = P.accent; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(E.rule.x - E.rule.w, E.rule.y); ctx.lineTo(E.rule.x, E.rule.y); ctx.stroke(); ctx.restore();
  cpuBtn("درخواست استعلام قیمت", E.cta.x, E.cta.y, E.cta.w, E.cta.h, LT.button, prog(n, CUTS[8] + 44, 16));
  const pa = prog(n, CUTS[8] + 22, 12);
  if (pa > 0.01){
    ctx.save(); ctx.globalAlpha = pa*copyMul;
    ctx.direction = "rtl"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    setFont(500, LT.label, 0);
    const names = ["شرکت فولاد آریا", "پتروشیمی خلیج", "راه‌آهن ایران"];
    names.forEach((s2, i) => {
      const x = E.partner.x0 + (i - 1)*E.partner.gap;
      ctx.fillStyle = P.light; ctx.fillText(s2, x, E.partner.y);
      ctx.strokeStyle = rgba(P.light, 0.20); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x - E.partner.gap*0.38, E.partner.y + 16); ctx.lineTo(x + E.partner.gap*0.38, E.partner.y + 16); ctx.stroke();
    });
    ctx.fillStyle = rgba(P.white, 0.55); setFont(600, Math.round(LT.label*0.86), 0);
    ctx.fillText("نمونهٔ مشتریان صنعتی", E.partner.x0, E.partner.y - LT.label*1.7);
    ctx.restore();
  }
  const la = prog(n, CUTS[8] + 34, 14);
  if (la > 0.01){
    ctx.save(); ctx.globalAlpha = la*copyMul;
    const bx = E.legal.x, by = E.legal.y - 24;
    ctx.fillStyle = rgba(P.white, 0.86);
    let x = bx - 116;
    barcode.forEach(bw => { ctx.fillRect(x, by - 46, bw*1.7, 46); x += bw*1.7 + 4.2; });
    ctx.restore();
    legalText("IR-PA 4140 / ISO 9001", E.legal.x + 150, E.legal.y, la, "center");
  }
  const bandY = E.band.y, bandH = E.band.h;
  ctx.save();
  ctx.fillStyle = rgba(P.shadow1, 0.96); ctx.fillRect(0, bandY, W, bandH);
  const off = (t*34) % 64;
  for (let x = -64; x < W + 64; x += 64){
    ctx.save(); ctx.translate(x + off, bandY + 2); ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(24, 0); ctx.lineTo(0, bandH - 4); ctx.lineTo(-24, bandH - 4); ctx.closePath();
    ctx.fillStyle = rgba(P.accent, 0.68); ctx.fill(); ctx.restore();
  }
  ctx.strokeStyle = rgba(P.light, 0.22); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, bandY - 1); ctx.lineTo(W, bandY - 1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, bandY + bandH + 1); ctx.lineTo(W, bandY + bandH + 1); ctx.stroke();
  ctx.restore();
}
/* ---------------- grade: warm workshop, cool shadows, corner falloff ---------------------------- */
function grade(){
  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = rgba(P.fill, 0.20); ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "screen";
  ctx.fillStyle = rg(W*L.keyX, H*0.10, 0, Math.max(W, H)*0.95, [[0, rgba(P.key, 0.13)], [0.5, rgba(P.key, 0.05)], [1, rgba(P.key, 0)]]);
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = rg(W*0.5, H*0.44, Math.min(W, H)*0.34, Math.max(W, H)*0.82, [[0, rgba(P.shadow2, 0)], [0.6, rgba(P.shadow2, 0.28)], [1, rgba(P.shadow2, 0.62)]]);
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
/* ---------------- the shader transition (story: the saw pinches the frame shut) ----------------- */
let FX = null, FXOK = false;
try { FX = PA.fx.create(null, {width: W, height: H}); PA.fx.compile("BowTieHorizontal"); FXOK = true; } catch (e) { FXOK = false; }
const TBUF = {a: document.createElement("canvas"), b: document.createElement("canvas")};
TBUF.a.width = TBUF.b.width = W; TBUF.a.height = TBUF.b.height = H;
const TA = TBUF.a.getContext("2d"), TBB = TBUF.b.getContext("2d");
const TRANS = {at: CUTS[1], len: 12, shader: "BowTieHorizontal", seed: 7};
/* ---------------- render (a PURE function of the integer frame n) ------------------------------- */
const PERF = params.get("perf") === "1";
function paint(n, s){ if (s >= 8){ finale(n); return; } paintWorld(n, s); }
function render(n){
  n = Math.max(0, Math.min(DURATION - 1, Math.round(n)));
  const s = sceneAt(n), pr = prog(n, TRANS.at - TRANS.len/2, TRANS.len);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  if (FXOK && pr > 0.001 && pr < 0.999){
    const sFrom = sceneAt(TRANS.at - TRANS.len/2), sTo = sceneAt(TRANS.at + TRANS.len/2);
    ctx = TA; paint(n, sFrom); dust(n, "back");
    ctx = TBB; paint(n, sTo); dust(n, "back");
    ctx = MAIN; ctx.setTransform(1, 0, 0, 1, 0, 0);
    let ok = true;
    try { FX.transition({from: TBUF.a, to: TBUF.b, shader: TRANS.shader, progress: pr, seed: TRANS.seed}); } catch (e) { ok = false; }
    if (ok) ctx.drawImage(FX.canvas, 0, 0, W, H); else ctx.drawImage(TBUF.b, 0, 0, W, H);
    sceneCopy(n, sFrom, 1 - pr);
    sceneCopy(n, sTo, pr);
  } else {
    ctx = MAIN; paint(n, s); dust(n, "back");
    sceneCopy(n, s, 1);
  }
  dust(n, "front");
  grade();
  window.film.frame = n;
}
/* ---------------- film API ---------------- */
window.film = {
  events: EVENTS, cuts: CUTS, cut_frames: CUTS, cut_beats: CUT_BEATS, duration: DUR, fps: FPS, bpm: BPM, t0: T0,
  frame: 0, ready: false, ratio: RATIO, layout: L, tokens: P,
  light: {key:"top-right", colour:P.key, softness:"very soft", fill:P.fill, ambient:P.shadow2},
  fx: () => (FXOK ? FX.info() : {backend:"none"}),
  seek(t){ render(Math.round(t*FPS)); return this.frame; }
};
function fit(){ const sc = params.get("capture") === "1" ? 1 : Math.min(innerWidth/W, innerHeight/H); stage.style.transform = `scale(${sc})`; }
addEventListener("resize", fit); fit();
Promise.all([document.fonts.load("900 40px PAHead"), document.fonts.load("700 40px PAHead"), document.fonts.load("300 40px PAHead"), document.fonts.load("600 40px PAHead")])
  .then(() => document.fonts.ready).then(() => { render(0); window.film.ready = true; });
</script>
